<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>面包管理 - 面包工坊</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', 'PingFang SC', sans-serif;
      background-color: #F9F7F3;
      width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* 顶部栏 */
    .page-header {
      height: 88px;
      background: #FFFFFF;
      border-bottom: 1px solid #E8E8E8;
      padding: 44px 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .page-title {
      font-size: 18px;
      font-weight: 700;
      color: #2C3E50;
    }

    .add-btn {
      font-size: 15px;
      font-weight: 600;
      color: #E67E22;
      background: none;
      border: none;
      cursor: pointer;
    }

    /* 视图切换 */
    .view-toggle {
      height: 48px;
      background: #FFFFFF;
      padding: 8px 16px;
      border-bottom: 1px solid #E8E8E8;
      display: flex;
      gap: 8px;
      position: sticky;
      top: 88px;
      z-index: 99;
    }

    .toggle-btn {
      flex: 1;
      height: 32px;
      border-radius: 16px;
      border: none;
      background: transparent;
      color: #7F8C8D;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: #E67E22;
      color: #FFFFFF;
    }

    /* 状态筛选 */
    .status-tabs {
      height: 48px;
      background: #FFFFFF;
      padding: 8px 16px;
      border-bottom: 1px solid #E8E8E8;
      display: flex;
      gap: 8px;
      position: sticky;
      top: 136px;
      z-index: 98;
    }

    .status-tab {
      padding: 0 16px;
      height: 32px;
      border-radius: 16px;
      border: none;
      background: transparent;
      color: #7F8C8D;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .status-tab.active {
      background: #FFF5ED;
      color: #E67E22;
    }

    /* 面包列表 */
    .bread-list {
      padding: 12px 16px;
    }

    .bread-manage-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      display: flex;
      gap: 12px;
    }

    .bread-image {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      background: #F0F0F0;
      flex-shrink: 0;
    }

    .bread-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .bread-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .bread-name {
      font-size: 16px;
      font-weight: 600;
      color: #2C3E50;
    }

    .bread-status {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      color: white;
    }

    .bread-status.available {
      background: #27AE60;
    }

    .bread-status.sold-out {
      background: #F39C12;
    }

    .bread-status.offline {
      background: #95A5A6;
    }

    .bread-price {
      font-size: 16px;
      font-weight: 600;
      color: #E67E22;
      margin-bottom: 4px;
    }

    .bread-desc {
      font-size: 13px;
      color: #7F8C8D;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .bread-stats {
      font-size: 12px;
      color: #7F8C8D;
      margin-bottom: 8px;
    }

    .bread-actions {
      display: flex;
      gap: 8px;
    }

    .bread-btn {
      flex: 1;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid;
    }

    .bread-btn.edit {
      background: white;
      color: #E67E22;
      border-color: #E67E22;
    }

    .bread-btn.offline {
      background: white;
      color: #95A5A6;
      border-color: #E8E8E8;
    }

    .bread-btn.online {
      background: #27AE60;
      color: white;
      border-color: #27AE60;
    }

    /* 底部导航 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #FFFFFF;
      border-top: 1px solid #E8E8E8;
      display: flex;
      max-width: 375px;
      margin: 0 auto;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #7F8C8D;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-item.active {
      color: #E67E22;
    }
  </style>
</head>
<body>
  <!-- 顶部栏 -->
  <div class="page-header">
    <div class="page-title">面包管理</div>
    <button class="add-btn">＋新增</button>
  </div>

  <!-- 视图切换 -->
  <div class="view-toggle">
    <button class="toggle-btn">订单视图</button>
    <button class="toggle-btn active">面包视图</button>
  </div>

  <!-- 状态筛选 -->
  <div class="status-tabs">
    <button class="status-tab active">全部</button>
    <button class="status-tab">在售</button>
    <button class="status-tab">售罄</button>
    <button class="status-tab">下架</button>
  </div>

  <!-- 面包列表 -->
  <div class="bread-list">
    <!-- 在售面包 -->
    <div class="bread-manage-card">
      <div class="bread-image"></div>
      <div class="bread-content">
        <div class="bread-header">
          <div class="bread-name">法式长棍</div>
          <div class="bread-status available">在售</div>
        </div>
        <div class="bread-price">¥28/个</div>
        <div class="bread-desc">口感酥脆，外焦里嫩，采用传统法式工艺制作</div>
        <div class="bread-stats">已售: 156份 | 库存: 20个</div>
        <div class="bread-actions">
          <button class="bread-btn edit">编辑</button>
          <button class="bread-btn offline">下架</button>
        </div>
      </div>
    </div>

    <!-- 售罄面包 -->
    <div class="bread-manage-card">
      <div class="bread-image"></div>
      <div class="bread-content">
        <div class="bread-header">
          <div class="bread-name">牛角可颂</div>
          <div class="bread-status sold-out">售罄</div>
        </div>
        <div class="bread-price">¥32/个</div>
        <div class="bread-desc">层次分明，黄油香浓</div>
        <div class="bread-stats">已售: 142份 | 库存: 0个</div>
        <div class="bread-actions">
          <button class="bread-btn edit">编辑</button>
          <button class="bread-btn offline">下架</button>
        </div>
      </div>
    </div>

    <!-- 下架面包 -->
    <div class="bread-manage-card">
      <div class="bread-image"></div>
      <div class="bread-content">
        <div class="bread-header">
          <div class="bread-name">原味贝果</div>
          <div class="bread-status offline">下架</div>
        </div>
        <div class="bread-price">¥18/个</div>
        <div class="bread-desc">Q弹有嚼劲，低脂健康</div>
        <div class="bread-stats">已售: 89份</div>
        <div class="bread-actions">
          <button class="bread-btn edit">编辑</button>
          <button class="bread-btn online">上架</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <a href="baker-orders.html" class="nav-item">
      <div>📋</div>
      <div>订单</div>
    </a>
    <a href="baker-breads.html" class="nav-item active">
      <div>🍞</div>
      <div>面包</div>
    </a>
    <a href="baker-profile.html" class="nav-item">
      <div>👤</div>
      <div>我的</div>
    </a>
  </div>
</body>
</html>
