<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>面包工坊 - 首页</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background-color: #F9F7F3;
      width: 375px;
      margin: 0 auto;
      position: relative;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* 顶部导航栏 */
    .top-nav {
      height: 88px;
      background: #FFFFFF;
      border-bottom: 1px solid #E8E8E8;
      padding: 44px 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-content {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .city-selector {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 15px;
      font-weight: 600;
      color: #2C3E50;
    }

    .search-bar {
      flex: 1;
      height: 36px;
      background: #F9F7F3;
      border-radius: 18px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-bar input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      outline: none;
    }

    .search-bar input::placeholder {
      color: #7F8C8D;
    }

    /* 视图切换器 */
    .view-toggle {
      height: 48px;
      background: #FFFFFF;
      padding: 8px 16px;
      border-bottom: 1px solid #E8E8E8;
      display: flex;
      gap: 8px;
    }

    .toggle-btn {
      flex: 1;
      height: 32px;
      border-radius: 16px;
      border: none;
      background: transparent;
      color: #7F8C8D;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .toggle-btn.active {
      background: #E67E22;
      color: #FFFFFF;
      box-shadow: 0 2px 4px rgba(230, 126, 34, 0.3);
    }

    /* 主理人列表 */
    .baker-list {
      padding: 12px 16px;
    }

    .baker-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .baker-card:active {
      transform: scale(0.98);
    }

    .baker-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .baker-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #E8E8E8;
      background: #F0F0F0;
    }

    .baker-info {
      flex: 1;
    }

    .baker-name {
      font-size: 16px;
      font-weight: 700;
      color: #2C3E50;
      margin-bottom: 4px;
    }

    .baker-status {
      font-size: 12px;
      color: #27AE60;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #27AE60;
    }

    .baker-bookmark {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .bookmark-icon {
      width: 24px;
      height: 24px;
      color: #E67E22;
    }

    .bookmark-count {
      font-size: 11px;
      color: #7F8C8D;
    }

    .baker-meta {
      font-size: 13px;
      color: #7F8C8D;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
    }

    .baker-breads {
      display: flex;
      gap: 8px;
      justify-content: space-between;
    }

    .bread-thumb {
      width: calc((100% - 16px) / 3);
      aspect-ratio: 1;
      border-radius: 8px;
      background: #F0F0F0;
    }

    /* 底部导航 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #FFFFFF;
      border-top: 1px solid #E8E8E8;
      display: flex;
      max-width: 375px;
      margin: 0 auto;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #7F8C8D;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-item.active {
      color: #E67E22;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 80px 16px;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-text {
      font-size: 15px;
      color: #7F8C8D;
      margin-bottom: 8px;
    }

    .empty-hint {
      font-size: 13px;
      color: #BDC3C7;
    }
  </style>
</head>
<body>
  <!-- 顶部导航栏 -->
  <div class="top-nav">
    <div class="nav-content">
      <div class="city-selector">
        📍 深圳 ▼
      </div>
      <div class="search-bar">
        🔍
        <input type="text" placeholder="搜索面包...">
      </div>
    </div>
  </div>

  <!-- 视图切换器 -->
  <div class="view-toggle">
    <button class="toggle-btn active">列表视图</button>
    <button class="toggle-btn">地图视图</button>
  </div>

  <!-- 主理人列表 -->
  <div class="baker-list">
    <!-- 主理人卡片 1 -->
    <div class="baker-card">
      <div class="baker-header">
        <div class="baker-avatar"></div>
        <div class="baker-info">
          <div class="baker-name">李师傅的面包工坊</div>
          <div class="baker-status">
            <span class="status-dot"></span>
            营业中
          </div>
        </div>
        <div class="baker-bookmark">
          <div class="bookmark-icon">❤️</div>
          <div class="bookmark-count">156</div>
        </div>
      </div>
      <div class="baker-meta">
        <span>距离 1.2km</span>
        <span>•</span>
        <span>主营: 法棍、可颂、贝果</span>
      </div>
      <div class="baker-breads">
        <div class="bread-thumb"></div>
        <div class="bread-thumb"></div>
        <div class="bread-thumb"></div>
      </div>
    </div>

    <!-- 主理人卡片 2 -->
    <div class="baker-card">
      <div class="baker-header">
        <div class="baker-avatar"></div>
        <div class="baker-info">
          <div class="baker-name">小麦烘焙坊</div>
          <div class="baker-status">
            <span class="status-dot"></span>
            营业中
          </div>
        </div>
        <div class="baker-bookmark">
          <div class="bookmark-icon">🤍</div>
          <div class="bookmark-count">89</div>
        </div>
      </div>
      <div class="baker-meta">
        <span>距离 2.5km</span>
        <span>•</span>
        <span>主营: 吐司、欧包、甜面包</span>
      </div>
      <div class="baker-breads">
        <div class="bread-thumb"></div>
        <div class="bread-thumb"></div>
        <div class="bread-thumb"></div>
      </div>
    </div>

    <!-- 主理人卡片 3 -->
    <div class="baker-card">
      <div class="baker-header">
        <div class="baker-avatar"></div>
        <div class="baker-info">
          <div class="baker-name">暖心面包屋</div>
          <div class="baker-status" style="color: #95A5A6;">
            <span class="status-dot" style="background: #95A5A6;"></span>
            已打烊
          </div>
        </div>
        <div class="baker-bookmark">
          <div class="bookmark-icon">❤️</div>
          <div class="bookmark-count">234</div>
        </div>
      </div>
      <div class="baker-meta">
        <span>距离 3.8km</span>
        <span>•</span>
        <span>主营: 软欧、贝果、司康</span>
      </div>
      <div class="baker-breads">
        <div class="bread-thumb"></div>
        <div class="bread-thumb"></div>
        <div class="bread-thumb"></div>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <div class="nav-icon">🏠</div>
      <div>首页</div>
    </a>
    <a href="orders.html" class="nav-item">
      <div class="nav-icon">🛍️</div>
      <div>订单</div>
    </a>
    <a href="profile.html" class="nav-item">
      <div class="nav-icon">👤</div>
      <div>我的</div>
    </a>
  </div>
</body>
</html>
