<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>订单 - 面包工坊</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', 'PingFang SC', sans-serif;
      background-color: #F9F7F3;
      width: 375px;
      margin: 0 auto;
      position: relative;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* 顶部标题栏 */
    .page-header {
      height: 88px;
      background: #FFFFFF;
      border-bottom: 1px solid #E8E8E8;
      padding: 44px 16px 0;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .page-title {
      font-size: 18px;
      font-weight: 700;
      color: #2C3E50;
      line-height: 44px;
    }

    /* 视图切换器 */
    .view-toggle {
      height: 48px;
      background: #FFFFFF;
      padding: 8px 16px;
      border-bottom: 1px solid #E8E8E8;
      display: flex;
      gap: 8px;
      position: sticky;
      top: 88px;
      z-index: 99;
    }

    .toggle-btn {
      flex: 1;
      height: 32px;
      border-radius: 16px;
      border: none;
      background: transparent;
      color: #7F8C8D;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .toggle-btn.active {
      background: #E67E22;
      color: #FFFFFF;
      box-shadow: 0 2px 4px rgba(230, 126, 34, 0.3);
    }

    /* 状态筛选 */
    .status-tabs {
      height: 48px;
      background: #FFFFFF;
      padding: 8px 16px;
      border-bottom: 1px solid #E8E8E8;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      position: sticky;
      top: 136px;
      z-index: 98;
    }

    .status-tabs::-webkit-scrollbar {
      display: none;
    }

    .status-tab {
      padding: 0 16px;
      height: 32px;
      border-radius: 16px;
      border: none;
      background: transparent;
      color: #7F8C8D;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .status-tab.active {
      background: #FFF5ED;
      color: #E67E22;
    }

    /* 订单列表 */
    .order-list {
      padding: 12px 16px;
    }

    .order-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .order-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #F0F0F0;
    }

    .baker-brief {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .baker-avatar-small {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #F0F0F0;
    }

    .baker-name-small {
      font-size: 15px;
      font-weight: 600;
      color: #2C3E50;
    }

    .order-status {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      color: white;
    }

    .order-status.pending {
      background: #F39C12;
    }

    .order-status.completed {
      background: #27AE60;
    }

    .order-status.cancelled {
      background: #95A5A6;
    }

    .order-number {
      font-size: 12px;
      color: #7F8C8D;
      margin-bottom: 12px;
    }

    .order-items {
      background: #F9F7F3;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .order-item:last-child {
      margin-bottom: 0;
    }

    .item-name {
      color: #2C3E50;
    }

    .item-price {
      color: #7F8C8D;
    }

    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-total {
      font-size: 16px;
      color: #2C3E50;
    }

    .order-total-price {
      font-size: 20px;
      font-weight: 700;
      color: #E67E22;
    }

    .order-actions {
      display: flex;
      gap: 8px;
    }

    .order-btn {
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid;
    }

    .order-btn.secondary {
      background: white;
      color: #7F8C8D;
      border-color: #E8E8E8;
    }

    .order-btn.primary {
      background: #E67E22;
      color: white;
      border-color: #E67E22;
    }

    /* 底部导航 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #FFFFFF;
      border-top: 1px solid #E8E8E8;
      display: flex;
      max-width: 375px;
      margin: 0 auto;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #7F8C8D;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-item.active {
      color: #E67E22;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>
  <!-- 顶部标题栏 -->
  <div class="page-header">
    <div class="page-title">订单</div>
  </div>

  <!-- 视图切换器 -->
  <div class="view-toggle">
    <button class="toggle-btn active">订单视图</button>
    <button class="toggle-btn">面包视图</button>
  </div>

  <!-- 状态筛选 -->
  <div class="status-tabs">
    <button class="status-tab active">全部</button>
    <button class="status-tab">待取货</button>
    <button class="status-tab">已完成</button>
    <button class="status-tab">已取消</button>
  </div>

  <!-- 订单列表 -->
  <div class="order-list">
    <!-- 订单卡片 1 - 待取货 -->
    <div class="order-card">
      <div class="order-header">
        <div class="baker-brief">
          <div class="baker-avatar-small"></div>
          <div class="baker-name-small">李师傅的面包工坊</div>
        </div>
        <div class="order-status pending">待取货</div>
      </div>
      <div class="order-number">订单号: #20240101234</div>
      <div class="order-items">
        <div class="order-item">
          <span class="item-name">法式长棍 × 2</span>
          <span class="item-price">¥56</span>
        </div>
        <div class="order-item">
          <span class="item-name">牛角可颂 × 1</span>
          <span class="item-price">¥32</span>
        </div>
      </div>
      <div class="order-footer">
        <div class="order-total">
          总价: <span class="order-total-price">¥88</span>
        </div>
        <div class="order-actions">
          <button class="order-btn secondary">取消</button>
          <button class="order-btn primary">确认取货</button>
        </div>
      </div>
    </div>

    <!-- 订单卡片 2 - 已完成 -->
    <div class="order-card">
      <div class="order-header">
        <div class="baker-brief">
          <div class="baker-avatar-small"></div>
          <div class="baker-name-small">小麦烘焙坊</div>
        </div>
        <div class="order-status completed">已完成</div>
      </div>
      <div class="order-number">订单号: #20231230156</div>
      <div class="order-items">
        <div class="order-item">
          <span class="item-name">全麦吐司 × 1</span>
          <span class="item-price">¥25</span>
        </div>
        <div class="order-item">
          <span class="item-name">原味贝果 × 3</span>
          <span class="item-price">¥54</span>
        </div>
      </div>
      <div class="order-footer">
        <div class="order-total">
          总价: <span class="order-total-price">¥79</span>
        </div>
        <div class="order-actions">
          <button class="order-btn secondary">再来一单</button>
        </div>
      </div>
    </div>

    <!-- 订单卡片 3 - 已取消 -->
    <div class="order-card">
      <div class="order-header">
        <div class="baker-brief">
          <div class="baker-avatar-small"></div>
          <div class="baker-name-small">暖心面包屋</div>
        </div>
        <div class="order-status cancelled">已取消</div>
      </div>
      <div class="order-number">订单号: #20231229089</div>
      <div class="order-items">
        <div class="order-item">
          <span class="item-name">软欧包 × 2</span>
          <span class="item-price">¥48</span>
        </div>
      </div>
      <div class="order-footer">
        <div class="order-total">
          总价: <span class="order-total-price">¥48</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <a href="index.html" class="nav-item">
      <div class="nav-icon">🏠</div>
      <div>首页</div>
    </a>
    <a href="orders.html" class="nav-item active">
      <div class="nav-icon">🛍️</div>
      <div>订单</div>
    </a>
    <a href="profile.html" class="nav-item">
      <div class="nav-icon">👤</div>
      <div>我的</div>
    </a>
  </div>
</body>
</html>
