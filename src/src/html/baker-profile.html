<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>主理人中心 - 面包工坊</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', 'PingFang SC', sans-serif;
      background-color: #F9F7F3;
      width: 375px;
      margin: 0 auto;
      position: relative;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* 头部信息区 */
    .baker-header {
      background: linear-gradient(135deg, #E67E22 0%, #F39C12 100%);
      border-radius: 0 0 24px 24px;
      padding: 44px 16px 16px;
      color: white;
    }

    .shop-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .shop-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .shop-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.2);
    }

    .shop-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .shop-name {
      font-size: 18px;
      font-weight: 700;
    }

    .shop-category {
      font-size: 13px;
      opacity: 0.9;
    }

    .shop-toggle {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .toggle-switch {
      width: 32px;
      height: 18px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 9px;
      position: relative;
      cursor: pointer;
    }

    .toggle-switch.active {
      background: white;
    }

    .toggle-slider {
      width: 14px;
      height: 14px;
      background: #95A5A6;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: all 0.3s ease;
    }

    .toggle-switch.active .toggle-slider {
      left: 16px;
      background: #E67E22;
    }

    .toggle-label {
      font-size: 12px;
      opacity: 0.9;
    }

    .quick-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .quick-action-btn {
      height: 40px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    /* 数据看板 */
    .dashboard {
      padding: 16px;
    }

    .dashboard-title {
      font-size: 16px;
      font-weight: 700;
      color: #2C3E50;
      margin-bottom: 12px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #E67E22;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 13px;
      color: #7F8C8D;
    }

    /* 成就入口 */
    .achievement-section {
      padding: 0 16px 16px;
    }

    .achievement-card {
      background: linear-gradient(135deg, rgba(230, 126, 34, 0.06) 0%, rgba(243, 156, 18, 0.06) 100%);
      border: 1.5px solid rgba(230, 126, 34, 0.15);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .achievement-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .achievement-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #E67E22 0%, #F39C12 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .achievement-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .achievement-title {
      font-size: 15px;
      font-weight: 600;
      color: #E67E22;
    }

    .achievement-desc {
      font-size: 12px;
      color: #7F8C8D;
    }

    .achievement-arrow {
      font-size: 20px;
      color: #E67E22;
    }

    /* 底部导航 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #FFFFFF;
      border-top: 1px solid #E8E8E8;
      display: flex;
      max-width: 375px;
      margin: 0 auto;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #7F8C8D;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-item.active {
      color: #E67E22;
    }
  </style>
</head>
<body>
  <!-- 头部信息区 -->
  <div class="baker-header">
    <div class="shop-info">
      <div class="shop-main">
        <div class="shop-avatar"></div>
        <div class="shop-details">
          <div class="shop-name">李师傅的面包工坊</div>
          <div class="shop-category">主营: 法棍、可颂</div>
        </div>
      </div>
      <div class="shop-toggle">
        <div class="toggle-switch active" onclick="this.classList.toggle('active')">
          <div class="toggle-slider"></div>
        </div>
        <div class="toggle-label">营业中</div>
      </div>
    </div>
    <div class="quick-btns">
      <button class="quick-action-btn">💰 收款码</button>
      <button class="quick-action-btn">🔄 切换用户</button>
      <button class="quick-action-btn">🏆 成就</button>
    </div>
  </div>

  <!-- 数据看板 -->
  <div class="dashboard">
    <div class="dashboard-title">数据看板</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">12</div>
        <div class="stat-label">今日订单数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">5</div>
        <div class="stat-label">待处理订单</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">¥1,280</div>
        <div class="stat-label">今日收入</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">¥45,678</div>
        <div class="stat-label">总收入</div>
      </div>
    </div>
  </div>

  <!-- 我的成就 -->
  <div class="achievement-section">
    <div class="achievement-card">
      <div class="achievement-left">
        <div class="achievement-icon">🏆</div>
        <div class="achievement-text">
          <div class="achievement-title">我的成就</div>
          <div class="achievement-desc">查看销售排行榜</div>
        </div>
      </div>
      <div class="achievement-arrow">›</div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <a href="baker-orders.html" class="nav-item">
      <div>📋</div>
      <div>订单</div>
    </a>
    <a href="baker-breads.html" class="nav-item">
      <div>🍞</div>
      <div>面包</div>
    </a>
    <a href="baker-profile.html" class="nav-item active">
      <div>👤</div>
      <div>我的</div>
    </a>
  </div>
</body>
</html>
