<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的 - 面包工坊</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', 'PingFang SC', sans-serif;
      background-color: #F9F7F3;
      width: 375px;
      margin: 0 auto;
      position: relative;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* 头部信息区 */
    .profile-header {
      background: linear-gradient(135deg, #E67E22 0%, #F39C12 100%);
      border-radius: 0 0 24px 24px;
      padding: 44px 16px 24px;
      color: white;
    }

    .user-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.2);
    }

    .user-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .user-name {
      font-size: 18px;
      font-weight: 700;
    }

    .user-gender {
      font-size: 13px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      display: inline-block;
      width: fit-content;
    }

    .settings-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
    }

    /* 主理人入口区域 */
    .baker-entrance-section {
      padding: 16px;
      margin-top: -20px;
    }

    .baker-entrance-card {
      background: linear-gradient(135deg, rgba(230, 126, 34, 0.05) 0%, rgba(243, 156, 18, 0.05) 100%);
      border: 2px solid #E67E22;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(230, 126, 34, 0.1);
    }

    .baker-entrance-card:active {
      transform: translateY(2px);
      box-shadow: 0 2px 6px rgba(230, 126, 34, 0.15);
    }

    .baker-entrance-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .baker-entrance-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #E67E22 0%, #F39C12 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 2px 8px rgba(230, 126, 34, 0.3);
    }

    .baker-entrance-title {
      font-size: 17px;
      font-weight: 700;
      color: #E67E22;
    }

    .baker-entrance-desc {
      font-size: 13px;
      color: #7F8C8D;
      line-height: 1.5;
    }

    /* 成为主理人卡片 - 渐变背景样式 */
    .become-baker-card {
      background: linear-gradient(135deg, #E67E22 0%, #F39C12 100%);
      border: none;
      color: white;
    }

    .become-baker-card .baker-entrance-icon {
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
    }

    .become-baker-card .baker-entrance-title {
      color: white;
    }

    .become-baker-card .baker-entrance-desc {
      color: rgba(255, 255, 255, 0.9);
    }

    /* 功能菜单 */
    .menu-section {
      padding: 0 16px 16px;
    }

    .menu-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .menu-card:active {
      transform: scale(0.98);
    }

    .menu-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(230, 126, 34, 0.1) 0%, rgba(243, 156, 18, 0.1) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .menu-text {
      font-size: 15px;
      font-weight: 600;
      color: #2C3E50;
    }

    .menu-arrow {
      font-size: 20px;
      color: #BDC3C7;
    }

    /* 底部导航 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #FFFFFF;
      border-top: 1px solid #E8E8E8;
      display: flex;
      max-width: 375px;
      margin: 0 auto;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #7F8C8D;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-item.active {
      color: #E67E22;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
    }

    /* 设置下拉菜单 */
    .settings-menu {
      position: absolute;
      top: 70px;
      right: 16px;
      width: 160px;
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      display: none;
      z-index: 1000;
    }

    .settings-menu.show {
      display: block;
      animation: scaleIn 0.2s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .settings-item {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      border-bottom: 1px solid #E8E8E8;
      font-size: 14px;
      color: #2C3E50;
    }

    .settings-item:last-child {
      border-bottom: none;
      color: #E74C3C;
    }

    .settings-item:hover {
      background: #F9F7F3;
    }
  </style>
</head>
<body>
  <!-- 头部信息区 -->
  <div class="profile-header">
    <div class="user-info">
      <div class="user-main">
        <div class="user-avatar"></div>
        <div class="user-details">
          <div class="user-name">面包爱好者</div>
          <div class="user-gender">男</div>
        </div>
      </div>
      <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
    </div>
  </div>

  <!-- 设置下拉菜单 -->
  <div class="settings-menu" id="settingsMenu">
    <div class="settings-item">
      ✏️ 编辑资料
    </div>
    <div class="settings-item">
      🚪 退出登录
    </div>
  </div>

  <!-- 主理人入口区域 -->
  <div class="baker-entrance-section">
    <!-- 成为主理人卡片 - 橙色渐变背景 -->
    <div class="baker-entrance-card become-baker-card">
      <div class="baker-entrance-header">
        <div class="baker-entrance-icon">✨</div>
        <div class="baker-entrance-title">成为主理人</div>
      </div>
      <div class="baker-entrance-desc">开启你的面包工坊之旅，分享你的烘焙故事，与面包爱好者们一起成长。</div>
    </div>

    <!-- 主理人入口卡片 - 边框样式 -->
    <div class="baker-entrance-card">
      <div class="baker-entrance-header">
        <div class="baker-entrance-icon">🏪</div>
        <div class="baker-entrance-title">主理人中心</div>
      </div>
      <div class="baker-entrance-desc">管理你的面包工坊，查看订单数据，与顾客互动，提升经营效率。</div>
    </div>
  </div>

  <!-- 功能菜单 -->
  <div class="menu-section">
    <div class="menu-card">
      <div class="menu-left">
        <div class="menu-icon">🛍️</div>
        <div class="menu-text">我的订单</div>
      </div>
      <div class="menu-arrow">›</div>
    </div>

    <div class="menu-card">
      <div class="menu-left">
        <div class="menu-icon">📑</div>
        <div class="menu-text">我的收藏</div>
      </div>
      <div class="menu-arrow">›</div>
    </div>

    <div class="menu-card">
      <div class="menu-left">
        <div class="menu-icon">❤️</div>
        <div class="menu-text">我的喜欢</div>
      </div>
      <div class="menu-arrow">›</div>
    </div>

    <div class="menu-card">
      <div class="menu-left">
        <div class="menu-icon">📍</div>
        <div class="menu-text">我的地址</div>
      </div>
      <div class="menu-arrow">›</div>
    </div>

    <div class="menu-card">
      <div class="menu-left">
        <div class="menu-icon">💬</div>
        <div class="menu-text">问题反馈</div>
      </div>
      <div class="menu-arrow">›</div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <a href="index.html" class="nav-item">
      <div class="nav-icon">🏠</div>
      <div>首页</div>
    </a>
    <a href="orders.html" class="nav-item">
      <div class="nav-icon">🛍️</div>
      <div>订单</div>
    </a>
    <a href="profile.html" class="nav-item active">
      <div class="nav-icon">👤</div>
      <div>我的</div>
    </a>
  </div>

  <script>
    function toggleSettings() {
      const menu = document.getElementById('settingsMenu');
      menu.classList.toggle('show');
    }

    // 点击其他地方关闭菜单
    document.addEventListener('click', function(e) {
      const menu = document.getElementById('settingsMenu');
      const btn = document.querySelector('.settings-btn');
      if (!menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.remove('show');
      }
    });
  </script>
</body>
</html>
