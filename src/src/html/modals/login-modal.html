<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录提示弹窗</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', 'PingFang SC', sans-serif;
      background-color: #F9F7F3;
      width: 375px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* 遮罩层 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      max-width: 375px;
      margin: 0 auto;
    }

    /* 弹窗内容 */
    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 40px 24px 24px;
      width: 100%;
      max-width: 320px;
      position: relative;
      animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* 关闭按钮 */
    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #F0F0F0;
      border: none;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7F8C8D;
    }

    /* 图标 */
    .modal-icon {
      font-size: 48px;
      text-align: center;
      margin-bottom: 16px;
    }

    /* 标题 */
    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: #2C3E50;
      text-align: center;
      margin-bottom: 8px;
    }

    /* 描述 */
    .modal-desc {
      font-size: 14px;
      color: #7F8C8D;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* 功能列表 */
    .feature-list {
      margin-bottom: 24px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #2C3E50;
    }

    .feature-item:last-child {
      margin-bottom: 0;
    }

    .feature-check {
      color: #27AE60;
      font-size: 16px;
    }

    /* 按钮组 */
    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .modal-btn {
      flex: 1;
      height: 44px;
      border-radius: 22px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }

    .modal-btn.secondary {
      background: #F0F0F0;
      color: #7F8C8D;
    }

    .modal-btn.primary {
      background: linear-gradient(135deg, #E67E22 0%, #F39C12 100%);
      color: white;
    }
  </style>
</head>
<body>
  <div class="modal-overlay">
    <div class="modal-content">
      <button class="close-btn">×</button>
      
      <div class="modal-icon">🔐</div>
      
      <div class="modal-title">登录后继续</div>
      
      <div class="modal-desc">解锁更多精彩功能</div>
      
      <div class="feature-list">
        <div class="feature-item">
          <span class="feature-check">✓</span>
          <span>收藏喜欢的主理人</span>
        </div>
        <div class="feature-item">
          <span class="feature-check">✓</span>
          <span>下单购买美味面包</span>
        </div>
        <div class="feature-item">
          <span class="feature-check">✓</span>
          <span>查看历史订单</span>
        </div>
      </div>
      
      <div class="modal-actions">
        <button class="modal-btn secondary">稍后再说</button>
        <button class="modal-btn primary">立即登录</button>
      </div>
    </div>
  </div>
</body>
</html>
