<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>结算弹窗</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', 'PingFang SC', sans-serif;
      background-color: rgba(0, 0, 0, 0.5);
      width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      align-items: flex-end;
    }

    /* 底部抽屉 */
    .drawer-modal {
      width: 100%;
      max-height: 80vh;
      background: white;
      border-radius: 24px 24px 0 0;
      overflow: hidden;
      animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }
      to {
        transform: translateY(0);
      }
    }

    /* 顶部栏 */
    .modal-header {
      padding: 16px;
      border-bottom: 1px solid #F0F0F0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #F0F0F0;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #2C3E50;
    }

    /* 内容区 */
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      max-height: calc(80vh - 180px);
    }

    /* 主理人信息 */
    .baker-section {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #F0F0F0;
    }

    .baker-avatar-small {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #F0F0F0;
    }

    .baker-info-small {
      flex: 1;
    }

    .baker-name {
      font-size: 15px;
      font-weight: 600;
      color: #2C3E50;
      margin-bottom: 2px;
    }

    .baker-status-text {
      font-size: 12px;
      color: #27AE60;
    }

    /* 订单明细 */
    .order-section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #2C3E50;
      margin-bottom: 12px;
    }

    .order-items {
      background: #F9F7F3;
      border-radius: 12px;
      padding: 12px;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .order-item:last-child {
      margin-bottom: 0;
    }

    .item-name {
      color: #2C3E50;
    }

    .item-price {
      color: #7F8C8D;
    }

    /* 备注区 */
    .note-section {
      margin-bottom: 20px;
    }

    .note-textarea {
      width: 100%;
      min-height: 80px;
      padding: 12px;
      border: 1px solid #E8E8E8;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
    }

    .note-textarea:focus {
      border-color: #E67E22;
    }

    /* 总价 */
    .total-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-top: 1px solid #F0F0F0;
    }

    .total-label {
      font-size: 16px;
      color: #2C3E50;
    }

    .total-price {
      font-size: 24px;
      font-weight: 700;
      color: #E67E22;
    }

    /* 底部按钮 */
    .modal-footer {
      position: sticky;
      bottom: 0;
      background: white;
      padding: 16px;
      border-top: 1px solid #F0F0F0;
    }

    .submit-btn {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #E67E22 0%, #F39C12 100%);
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="drawer-modal">
    <!-- 顶部栏 -->
    <div class="modal-header">
      <button class="close-btn">×</button>
      <div class="modal-title">确认订单</div>
    </div>

    <!-- 内容区 -->
    <div class="modal-body">
      <!-- 主理人信息 -->
      <div class="baker-section">
        <div class="baker-avatar-small"></div>
        <div class="baker-info-small">
          <div class="baker-name">李师傅的面包工坊</div>
          <div class="baker-status-text">🟢 营业中</div>
        </div>
      </div>

      <!-- 订单明细 -->
      <div class="order-section">
        <div class="section-title">订单明细</div>
        <div class="order-items">
          <div class="order-item">
            <span class="item-name">法式长棍 × 2</span>
            <span class="item-price">¥56</span>
          </div>
          <div class="order-item">
            <span class="item-name">牛角可颂 × 1</span>
            <span class="item-price">¥32</span>
          </div>
        </div>
      </div>

      <!-- 备注 -->
      <div class="note-section">
        <div class="section-title">备注</div>
        <textarea 
          class="note-textarea" 
          placeholder="给主理人留言（选填）"
          maxlength="100"
        ></textarea>
      </div>

      <!-- 总价 -->
      <div class="total-section">
        <div class="total-label">总计</div>
        <div class="total-price">¥88</div>
      </div>
    </div>

    <!-- 底部按钮 -->
    <div class="modal-footer">
      <button class="submit-btn">确认下单</button>
    </div>
  </div>
</body>
</html>
