<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>订单管理 - 面包工坊</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', 'PingFang SC', sans-serif;
      background-color: #F9F7F3;
      width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* 顶部栏 */
    .page-header {
      height: 88px;
      background: #FFFFFF;
      border-bottom: 1px solid #E8E8E8;
      padding: 44px 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .page-title {
      font-size: 18px;
      font-weight: 700;
      color: #2C3E50;
    }

    .achievement-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #E67E22 0%, #F39C12 100%);
      border: none;
      font-size: 18px;
      cursor: pointer;
    }

    /* 视图切换 */
    .view-toggle {
      height: 48px;
      background: #FFFFFF;
      padding: 8px 16px;
      border-bottom: 1px solid #E8E8E8;
      display: flex;
      gap: 8px;
      position: sticky;
      top: 88px;
      z-index: 99;
    }

    .toggle-btn {
      flex: 1;
      height: 32px;
      border-radius: 16px;
      border: none;
      background: transparent;
      color: #7F8C8D;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: #E67E22;
      color: #FFFFFF;
    }

    /* 状态筛选 */
    .status-tabs {
      height: 48px;
      background: #FFFFFF;
      padding: 8px 16px;
      border-bottom: 1px solid #E8E8E8;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      position: sticky;
      top: 136px;
      z-index: 98;
    }

    .status-tabs::-webkit-scrollbar {
      display: none;
    }

    .status-tab {
      padding: 0 16px;
      height: 32px;
      border-radius: 16px;
      border: none;
      background: transparent;
      color: #7F8C8D;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .status-tab.active {
      background: #FFF5ED;
      color: #E67E22;
    }

    /* 订单列表 */
    .order-list {
      padding: 12px 16px;
    }

    .order-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #F0F0F0;
    }

    .customer-info {
      flex: 1;
    }

    .customer-name {
      font-size: 15px;
      font-weight: 600;
      color: #2C3E50;
      margin-bottom: 4px;
    }

    .customer-phone {
      font-size: 12px;
      color: #7F8C8D;
      margin-bottom: 4px;
    }

    .order-number {
      font-size: 12px;
      color: #7F8C8D;
    }

    .order-status {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      color: white;
      white-space: nowrap;
    }

    .order-status.pending {
      background: #F39C12;
    }

    .order-status.accepted {
      background: #3498DB;
    }

    .order-status.ready {
      background: #9B59B6;
    }

    .order-items {
      margin-bottom: 12px;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .order-item:last-child {
      margin-bottom: 0;
    }

    .note-section {
      background: #FFF5ED;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #7F8C8D;
    }

    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-total {
      font-size: 16px;
      color: #2C3E50;
    }

    .order-total-price {
      font-size: 20px;
      font-weight: 700;
      color: #E67E22;
    }

    .order-actions {
      display: flex;
      gap: 8px;
    }

    .order-btn {
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid;
    }

    .order-btn.reject {
      background: white;
      color: #95A5A6;
      border-color: #E8E8E8;
    }

    .order-btn.accept {
      background: #E67E22;
      color: white;
      border-color: #E67E22;
    }

    .order-btn.complete {
      background: #3498DB;
      color: white;
      border-color: #3498DB;
    }

    .order-btn.confirm {
      background: #27AE60;
      color: white;
      border-color: #27AE60;
    }

    /* 底部导航 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #FFFFFF;
      border-top: 1px solid #E8E8E8;
      display: flex;
      max-width: 375px;
      margin: 0 auto;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #7F8C8D;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-item.active {
      color: #E67E22;
    }
  </style>
</head>
<body>
  <!-- 顶部栏 -->
  <div class="page-header">
    <div class="page-title">订单管理</div>
    <button class="achievement-btn">🏆</button>
  </div>

  <!-- 视图切换 -->
  <div class="view-toggle">
    <button class="toggle-btn active">订单视图</button>
    <button class="toggle-btn">面包视图</button>
  </div>

  <!-- 状态筛选 -->
  <div class="status-tabs">
    <button class="status-tab active">全部</button>
    <button class="status-tab">待接单</button>
    <button class="status-tab">制作中</button>
    <button class="status-tab">待取货</button>
    <button class="status-tab">已完成</button>
    <button class="status-tab">已拒绝</button>
  </div>

  <!-- 订单列表 -->
  <div class="order-list">
    <!-- 待接单订单 -->
    <div class="order-card">
      <div class="order-header">
        <div class="customer-info">
          <div class="customer-name">张三 (先生)</div>
          <div class="customer-phone">手机: 139****5678</div>
          <div class="order-number">订单号: #20240101234</div>
        </div>
        <div class="order-status pending">待接单</div>
      </div>
      <div class="order-items">
        <div class="order-item">
          <span>法式长棍 × 2</span>
          <span style="color: #7F8C8D;">¥56</span>
        </div>
        <div class="order-item">
          <span>牛角可颂 × 1</span>
          <span style="color: #7F8C8D;">¥32</span>
        </div>
      </div>
      <div class="note-section">
        备注: 请少放糖
      </div>
      <div class="order-footer">
        <div class="order-total">
          总价: <span class="order-total-price">¥88</span>
        </div>
        <div class="order-actions">
          <button class="order-btn reject">拒绝</button>
          <button class="order-btn accept">接单</button>
        </div>
      </div>
    </div>

    <!-- 制作中订单 -->
    <div class="order-card">
      <div class="order-header">
        <div class="customer-info">
          <div class="customer-name">李四 (女士)</div>
          <div class="customer-phone">手机: 138****1234</div>
          <div class="order-number">订单号: #20240101156</div>
        </div>
        <div class="order-status accepted">制作中</div>
      </div>
      <div class="order-items">
        <div class="order-item">
          <span>原味贝果 × 3</span>
          <span style="color: #7F8C8D;">¥54</span>
        </div>
      </div>
      <div class="order-footer">
        <div class="order-total">
          总价: <span class="order-total-price">¥54</span>
        </div>
        <div class="order-actions">
          <button class="order-btn complete">完成制作</button>
        </div>
      </div>
    </div>

    <!-- 待取货订单 -->
    <div class="order-card">
      <div class="order-header">
        <div class="customer-info">
          <div class="customer-name">王五 (先生)</div>
          <div class="customer-phone">手机: 137****9876</div>
          <div class="order-number">订单号: #20240101089</div>
        </div>
        <div class="order-status ready">待取货</div>
      </div>
      <div class="order-items">
        <div class="order-item">
          <span>全麦吐司 × 1</span>
          <span style="color: #7F8C8D;">¥25</span>
        </div>
        <div class="order-item">
          <span>软欧包 × 2</span>
          <span style="color: #7F8C8D;">¥48</span>
        </div>
      </div>
      <div class="order-footer">
        <div class="order-total">
          总价: <span class="order-total-price">¥73</span>
        </div>
        <div class="order-actions">
          <button class="order-btn confirm">确认取货</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <a href="baker-orders.html" class="nav-item active">
      <div>📋</div>
      <div>订单</div>
    </a>
    <a href="baker-breads.html" class="nav-item">
      <div>🍞</div>
      <div>面包</div>
    </a>
    <a href="baker-profile.html" class="nav-item">
      <div>👤</div>
      <div>我的</div>
    </a>
  </div>
</body>
</html>
