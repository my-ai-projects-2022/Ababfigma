<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>主理人详情 - 面包工坊</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Roboto', 'PingFang SC', sans-serif;
      background-color: #F9F7F3;
      width: 375px;
      margin: 0 auto;
      position: relative;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* 顶部导航 */
    .detail-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 88px;
      padding: 44px 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      max-width: 375px;
      margin: 0 auto;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
    }

    .nav-actions {
      display: flex;
      gap: 8px;
    }

    /* 主理人信息卡 */
    .baker-info-card {
      background: linear-gradient(135deg, #E67E22 0%, #F39C12 100%);
      padding: 88px 16px 24px;
      border-radius: 0 0 24px 24px;
      color: white;
      text-align: center;
    }

    .baker-avatar-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.2);
      margin: 0 auto 16px;
    }

    .baker-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .baker-subtitle {
      font-size: 14px;
      margin-bottom: 4px;
      opacity: 0.9;
    }

    .baker-address {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 12px;
    }

    .baker-categories {
      font-size: 13px;
      opacity: 0.9;
    }

    /* 面包列表 */
    .bread-list {
      padding: 16px;
    }

    .bread-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      display: flex;
      gap: 12px;
    }

    .bread-image {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      background: #F0F0F0;
      flex-shrink: 0;
    }

    .bread-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .bread-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .bread-name {
      font-size: 16px;
      font-weight: 600;
      color: #2C3E50;
    }

    .bread-like {
      font-size: 20px;
      cursor: pointer;
    }

    .bread-price {
      font-size: 20px;
      font-weight: 700;
      color: #E67E22;
      margin-bottom: 4px;
    }

    .bread-desc {
      font-size: 13px;
      color: #7F8C8D;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .bread-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .quantity-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #E8E8E8;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      color: #E67E22;
    }

    .qty-btn:active {
      transform: scale(0.95);
    }

    .qty-number {
      min-width: 32px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: #E67E22;
    }

    /* 购物车底栏 */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #FFFFFF;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.08);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 375px;
      margin: 0 auto;
    }

    .cart-icon-wrapper {
      position: relative;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #E67E22 0%, #F39C12 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
    }

    .cart-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #E74C3C;
      color: white;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
    }

    .cart-total {
      flex: 1;
      margin-left: 12px;
      font-size: 16px;
      font-weight: 600;
      color: #2C3E50;
    }

    .cart-total-price {
      color: #E67E22;
      font-size: 20px;
    }

    .checkout-btn {
      padding: 10px 24px;
      background: #E67E22;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .checkout-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <div class="detail-nav">
    <button class="nav-btn">←</button>
    <div class="nav-actions">
      <button class="nav-btn">📤</button>
      <button class="nav-btn">💬</button>
      <button class="nav-btn">❤️</button>
    </div>
  </div>

  <!-- 主理人信息卡 -->
  <div class="baker-info-card">
    <div class="baker-avatar-large"></div>
    <div class="baker-title">李师傅的面包工坊</div>
    <div class="baker-subtitle">🟢 营业中 · 距离你 1.2km</div>
    <div class="baker-address">📍 深圳市南山区科技园南路</div>
    <div class="baker-categories">主营: 法棍 • 可颂 • 贝果</div>
  </div>

  <!-- 面包列表 -->
  <div class="bread-list">
    <!-- 面包卡片 1 -->
    <div class="bread-card">
      <div class="bread-image"></div>
      <div class="bread-content">
        <div class="bread-header">
          <div class="bread-name">法式长棍</div>
          <div class="bread-like">❤️</div>
        </div>
        <div class="bread-price">¥28/个</div>
        <div class="bread-desc">口感酥脆，外焦里嫩，采用传统法式工艺制作</div>
        <div class="bread-footer">
          <div class="quantity-selector">
            <button class="qty-btn">−</button>
            <div class="qty-number">2</div>
            <button class="qty-btn">+</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 面包卡片 2 -->
    <div class="bread-card">
      <div class="bread-image"></div>
      <div class="bread-content">
        <div class="bread-header">
          <div class="bread-name">牛角可颂</div>
          <div class="bread-like">🤍</div>
        </div>
        <div class="bread-price">¥32/个</div>
        <div class="bread-desc">层次分明，黄油香浓，每一口都是幸福的味道</div>
        <div class="bread-footer">
          <div class="quantity-selector">
            <button class="qty-btn">−</button>
            <div class="qty-number">1</div>
            <button class="qty-btn">+</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 面包卡片 3 -->
    <div class="bread-card">
      <div class="bread-image"></div>
      <div class="bread-content">
        <div class="bread-header">
          <div class="bread-name">原味贝果</div>
          <div class="bread-like">🤍</div>
        </div>
        <div class="bread-price">¥18/个</div>
        <div class="bread-desc">Q弹有嚼劲，低脂健康，适合减脂人群</div>
        <div class="bread-footer">
          <div class="quantity-selector">
            <button class="qty-btn">−</button>
            <div class="qty-number" style="color: #BDC3C7;">0</div>
            <button class="qty-btn">+</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 购物车底栏 -->
  <div class="cart-bar">
    <div class="cart-icon-wrapper">
      🛒
      <div class="cart-badge">3</div>
    </div>
    <div class="cart-total">
      总价: <span class="cart-total-price">¥88</span>
    </div>
    <button class="checkout-btn">去结算 →</button>
  </div>
</body>
</html>
