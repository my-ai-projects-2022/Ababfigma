<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>收款码 - 面包工坊</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .payment-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease-out;
      padding: 20px;
    }

    .payment-modal-content {
      background-color: white;
      width: 100%;
      max-width: 340px;
      border-radius: 16px;
      position: relative;
      animation: scaleIn 0.3s ease-out;
    }

    .payment-modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--color-bg);
      color: var(--color-text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
      cursor: pointer;
    }

    .payment-modal-body {
      padding: 24px;
    }

    .payment-modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text-primary);
      text-align: center;
      margin-bottom: 20px;
    }

    .payment-qrcode {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .qrcode-image {
      width: 200px;
      height: 200px;
      border-radius: 12px;
      border: 1px solid var(--color-border);
    }

    .qrcode-hint {
      font-size: 12px;
      color: var(--color-text-secondary);
      text-align: center;
    }

    .payment-upload-btn {
      width: 100%;
      height: 44px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
      color: white;
      border-radius: 22px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3);
      transition: transform 0.2s;
      cursor: pointer;
    }

    .payment-upload-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="payment-modal-overlay" onclick="if(event.target === this) window.history.back()">
    <div class="payment-modal-content">
      <button class="payment-modal-close" onclick="window.history.back()">
        <svg class="icon" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="payment-modal-body">
        <h2 class="payment-modal-title">收款码设置</h2>
        
        <div class="payment-qrcode">
          <img src="https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?w=400" alt="收款二维码" class="qrcode-image" id="qrcodeImage" />
          <p class="qrcode-hint">上传您的微信/支付宝收款码</p>
        </div>

        <button class="payment-upload-btn" onclick="uploadQRCode()">
          上传收款码
        </button>
      </div>
    </div>
  </div>

  <script>
    function uploadQRCode() {
      alert('收款码上传功能待实现');
    }
  </script>
</body>
</html>
