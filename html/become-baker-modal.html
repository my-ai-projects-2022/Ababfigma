<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成为主理人 - 面包工坊</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .become-baker-modal-overlay {
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: 0.3s ease-out fadeIn;
      display: flex;
      position: fixed;
      inset: 0;
      overflow-y: auto;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .become-baker-modal-content {
      background-color: #fff;
      border-radius: 16px;
      flex-direction: column;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      margin: auto;
      animation: 0.3s ease-out scaleIn;
      display: flex;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .become-baker-modal-header {
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      display: flex;
      position: relative;
    }

    .become-baker-modal-title {
      color: var(--color-text-primary);
      font-size: 18px;
      font-weight: 700;
    }

    .become-baker-modal-close {
      width: 32px;
      height: 32px;
      color: var(--color-text-secondary);
      border-radius: 50%;
      justify-content: center;
      align-items: center;
      transition: background-color 0.2s;
      display: flex;
      cursor: pointer;
      border: none;
      background: none;
    }

    .become-baker-modal-close:hover {
      background-color: var(--color-border);
    }

    .become-baker-modal-body {
      flex: 1;
      padding: 18px 24px;
      overflow-y: auto;
    }

    .baker-form-group {
      margin-bottom: 18px;
    }

    .baker-form-group.avatar-group {
      flex-direction: column;
      align-items: center;
      margin-bottom: 26px;
      display: flex;
    }

    .baker-avatar-container {
      justify-content: center;
      width: 100%;
      display: flex;
    }

    .baker-form-label-row {
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      display: flex;
    }

    .baker-form-label {
      color: var(--color-text-primary);
      font-size: 13px;
      font-weight: 600;
      display: block;
    }

    .baker-form-hint {
      color: var(--color-text-secondary);
      margin-left: 8px;
      font-size: 11px;
      font-weight: 400;
    }

    .baker-form-error {
      color: var(--color-error);
      margin-left: 8px;
      font-size: 11px;
    }

    .baker-avatar-upload {
      cursor: pointer;
      border-radius: 50%;
      width: 100px;
      height: 100px;
      transition: transform .3s;
      position: relative;
      overflow: hidden;
      border: none;
      background: none;
      padding: 0;
    }

    .baker-avatar-upload:hover {
      transform: scale(1.05);
    }

    .baker-avatar-upload:hover .baker-avatar-upload-overlay {
      opacity: 1;
    }

    .baker-avatar-preview {
      object-fit: cover;
      width: 100%;
      height: 100%;
    }

    .baker-avatar-upload-overlay {
      color: #fff;
      opacity: 0;
      background-color: rgba(0, 0, 0, 0.6);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      transition: opacity .3s;
      display: flex;
      position: absolute;
      inset: 0;
    }

    .baker-avatar-upload-overlay span {
      font-size: 10px;
    }

    .baker-form-input {
      border: 1px solid var(--color-border);
      width: 100%;
      color: var(--color-text-primary);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      transition: border-color .3s;
      box-sizing: border-box;
    }

    .baker-form-input:focus {
      border-color: var(--color-primary);
      outline: none;
    }

    .baker-form-textarea {
      border: 1px solid var(--color-border);
      width: 100%;
      color: var(--color-text-primary);
      resize: vertical;
      border-radius: 8px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 13px;
      transition: border-color .3s;
      box-sizing: border-box;
    }

    .baker-form-textarea:focus {
      border-color: var(--color-primary);
      outline: none;
    }

    .baker-address-hint {
      color: var(--color-warning);
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      font-size: 10px;
      font-weight: 400;
      display: flex;
    }

    .baker-bread-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      display: grid;
    }

    .baker-bread-option {
      border: 1px solid var(--color-border);
      color: var(--color-text-secondary);
      text-align: center;
      background-color: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      transition: all .3s;
      cursor: pointer;
    }

    .baker-bread-option:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .baker-bread-option.selected {
      border-color: var(--color-primary);
      color: #fff;
      background-color: var(--color-primary);
    }

    .become-baker-modal-footer {
      border-top: 1px solid var(--color-border);
      flex-shrink: 0;
      gap: 12px;
      padding: 14px 24px;
      display: flex;
    }

    .baker-form-cancel,
    .baker-form-submit {
      border-radius: 8px;
      flex: 1;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 600;
      transition: all .3s;
      cursor: pointer;
      border: none;
    }

    .baker-form-cancel {
      background-color: var(--color-bg);
      color: var(--color-text-primary);
    }

    .baker-form-cancel:hover {
      background-color: var(--color-border);
    }

    .baker-form-submit {
      background-color: var(--color-primary);
      color: #fff;
    }

    .baker-form-submit:hover {
      background-color: var(--color-primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(230, 126, 34, 0.3);
    }

    .baker-form-submit:active {
      transform: translateY(0);
    }

    .baker-form-submit:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .baker-form-submit:disabled:hover {
      background-color: var(--color-primary);
      box-shadow: none;
      transform: none;
    }

    @media (max-width: 480px) {
      .baker-bread-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="become-baker-modal-overlay" onclick="if(event.target === this) closeModal()">
    <div class="become-baker-modal-content">
      <div class="become-baker-modal-header">
        <div class="become-baker-modal-title">成为主理人</div>
        <button class="become-baker-modal-close" onclick="closeModal()">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="become-baker-modal-body">
        <!-- 头像 -->
        <div class="baker-form-group avatar-group">
          <div class="baker-form-label-row">
            <label class="baker-form-label">头像</label>
          </div>
          <div class="baker-avatar-container">
            <button class="baker-avatar-upload" onclick="document.getElementById('avatarInput').click()">
              <img id="avatarPreview" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200" alt="头像" class="baker-avatar-preview" />
              <div class="baker-avatar-upload-overlay">
                <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                  <circle cx="12" cy="13" r="4"></circle>
                </svg>
                <span>更换头像</span>
              </div>
              <input
                id="avatarInput"
                type="file"
                accept="image/*"
                onchange="handleAvatarUpload(event)"
                style="display: none"
              />
            </button>
          </div>
        </div>

        <!-- 主理人名称 -->
        <div class="baker-form-group">
          <div class="baker-form-label-row">
            <label class="baker-form-label">主理人名称</label>
            <span class="baker-form-error hidden" id="nameError"></span>
          </div>
          <input
            type="text"
            class="baker-form-input"
            id="bakerName"
            placeholder="请输入主理人名称"
            maxlength="20"
          />
        </div>

        <!-- 擅长的面包 -->
        <div class="baker-form-group">
          <div class="baker-form-label-row">
            <label class="baker-form-label">
              擅长的面包
              <span class="baker-form-hint">（可多选）</span>
            </label>
            <span class="baker-form-error hidden" id="breadsError"></span>
          </div>
          <div class="baker-bread-grid" id="breadGrid">
            <!-- 动态渲染 -->
          </div>
        </div>

        <!-- 地址 -->
        <div class="baker-form-group">
          <div class="baker-form-label-row">
            <label class="baker-form-label">地址</label>
            <span class="baker-form-error hidden" id="addressError"></span>
          </div>
          <textarea
            class="baker-form-textarea"
            id="bakerAddress"
            placeholder="如：四川省成都市武侯区桐梓林"
            rows="3"
          ></textarea>
          <div class="baker-address-hint">
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            不要写到具体楼层或房间号
          </div>
        </div>

        <!-- 电话 -->
        <div class="baker-form-group">
          <div class="baker-form-label-row">
            <label class="baker-form-label">电话</label>
            <span class="baker-form-error hidden" id="phoneError"></span>
          </div>
          <input
            type="tel"
            class="baker-form-input"
            id="bakerPhone"
            placeholder="请输入手机号"
            maxlength="11"
          />
        </div>
      </div>

      <div class="become-baker-modal-footer">
        <button class="baker-form-cancel" onclick="closeModal()">取消</button>
        <button class="baker-form-submit" onclick="handleSubmit()" id="submitBtn">提交申请</button>
      </div>
    </div>
  </div>

  <script>
    const BREAD_TYPES = [
      '法棍', '可颂', '吐司', '欧包', '软欧包', '贝果', '丹麦酥', '牛角包', '司康',
      '全麦面包', '黑麦面包', '布里欧修', '佛卡夏', '肉桂卷', '甜甜圈', '菠萝包'
    ];

    const selectedBreads = [];
    let avatarUrl = 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200';

    function renderBreadGrid() {
      const container = document.getElementById('breadGrid');
      container.innerHTML = BREAD_TYPES.map(bread => `
        <button
          class="baker-bread-option"
          onclick="toggleBread('${bread}')"
          id="bread-${bread}"
        >
          ${bread}
        </button>
      `).join('');
    }

    function toggleBread(bread) {
      const index = selectedBreads.indexOf(bread);
      const btn = document.getElementById(`bread-${bread}`);
      
      if (index > -1) {
        selectedBreads.splice(index, 1);
        btn.classList.remove('selected');
      } else {
        selectedBreads.push(bread);
        btn.classList.add('selected');
      }
      
      // 清除错误提示
      const errorEl = document.getElementById('breadsError');
      if (errorEl && selectedBreads.length > 0) {
        errorEl.classList.add('hidden');
      }
    }

    function handleAvatarUpload(e) {
      const file = e.target.files?.[0];
      if (file) {
        const reader = new FileReader();
        reader.onloadend = () => {
          avatarUrl = reader.result;
          document.getElementById('avatarPreview').src = avatarUrl;
        };
        reader.readAsDataURL(file);
      }
    }

    function showError(id, message) {
      const errorEl = document.getElementById(id);
      if (errorEl) {
        errorEl.textContent = message;
        errorEl.classList.remove('hidden');
      }
    }

    function hideError(id) {
      const errorEl = document.getElementById(id);
      if (errorEl) {
        errorEl.classList.add('hidden');
      }
    }

    function validateForm() {
      const name = document.getElementById('bakerName').value.trim();
      const address = document.getElementById('bakerAddress').value.trim();
      const phone = document.getElementById('bakerPhone').value.trim();

      let isValid = true;

      if (!name) {
        showError('nameError', '请输入主理人名称');
        isValid = false;
      } else if (name.length < 2) {
        showError('nameError', '至少需要2个字');
        isValid = false;
      } else {
        hideError('nameError');
      }

      if (selectedBreads.length === 0) {
        showError('breadsError', '请至少选择一种');
        isValid = false;
      } else {
        hideError('breadsError');
      }

      if (!address) {
        showError('addressError', '请输入地址');
        isValid = false;
      } else {
        hideError('addressError');
      }

      if (!phone) {
        showError('phoneError', '请输入电话号码');
        isValid = false;
      } else if (!/^1[3-9]\d{9}$/.test(phone)) {
        showError('phoneError', '请输入正确的手机号');
        isValid = false;
      } else {
        hideError('phoneError');
      }

      return isValid;
    }

    function handleSubmit() {
      if (!validateForm()) {
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '提交中...';

      // 模拟提交
      setTimeout(() => {
        alert('申请提交成功！');
        closeModal();
      }, 1000);
    }

    function closeModal() {
      window.history.back();
    }

    renderBreadGrid();
  </script>
</body>
</html>
