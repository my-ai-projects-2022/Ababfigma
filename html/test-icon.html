<!DOCTYPE html>
<html>
<head>
  <title>图标测试</title>
  <style>
    .icon { width: 24px; height: 24px; }
    .test-box { padding: 20px; border: 1px solid #ccc; margin: 20px; }
  </style>
</head>
<body>
  <h1>图标测试</h1>
  <div class="test-box">
    <h2>Settings 图标 (24px)</h2>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M12 1v6m0 6v6m9-9h-6m-6 0H3m15.364 6.364l-4.243-4.243m-4.242 0L5.636 18.364m12.728 0l-4.243-4.243m-4.242 0L5.636 5.636"></path>
    </svg>
  </div>
  <div class="test-box">
    <h2>Clock 图标 (16px)</h2>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px;">
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12 6 12 12 16 14"></polyline>
    </svg>
  </div>
</body>
</html>
