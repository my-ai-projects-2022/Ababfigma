<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面包管理 - 面包工坊</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .baker-breads-page {
      background-color: var(--color-bg);
      max-width: 375px;
      min-height: 100vh;
      padding-bottom: calc(70px + env(safe-area-inset-bottom));
      margin: 0 auto;
    }

    .baker-breads-header {
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
      border-radius: 0 0 24px 24px;
      margin-bottom: 16px;
      padding: 16px;
    }

    .baker-breads-title {
      color: #fff;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
    }

    .baker-breads-content {
      margin-bottom: 16px;
      padding: 0 16px;
    }

    .baker-breads-empty {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px 32px;
      display: flex;
    }

    .baker-breads-empty-icon {
      margin-bottom: 16px;
      font-size: 64px;
    }

    .baker-breads-empty-text {
      color: var(--color-text-secondary);
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 600;
    }

    .baker-breads-empty-hint {
      color: var(--color-text-tertiary);
      font-size: 14px;
    }

    .baker-breads-list {
      flex-direction: column;
      gap: 12px;
      display: flex;
    }

    .bread-item {
      cursor: pointer;
      background-color: #fff;
      border-radius: 12px;
      gap: 12px;
      padding: 12px;
      transition: all .2s;
      display: flex;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .bread-item:active {
      transform: scale(.98);
    }

    .bread-item-image-wrapper {
      flex-shrink: 0;
      width: 80px;
      height: 80px;
      position: relative;
    }

    .bread-item-image {
      object-fit: cover;
      border-radius: 8px;
      width: 100%;
      height: 100%;
    }

    .bread-item-inactive-mask {
      color: #fff;
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      position: absolute;
      inset: 0;
    }

    .bread-item-info {
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      min-width: 0;
      display: flex;
    }

    .bread-item-header {
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 4px;
      display: flex;
    }

    .bread-item-name {
      color: var(--color-text-primary);
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      font-size: 15px;
      font-weight: 700;
      overflow: hidden;
    }

    .bread-item-price {
      color: var(--color-primary);
      flex-shrink: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .bread-item-stock {
      align-items: center;
      display: flex;
    }

    .bread-item-stock-text {
      color: #27ae60;
      background-color: rgba(39, 174, 96, 0.1);
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .bread-item-stock-text.sold-out {
      color: #95a5a6;
      background-color: rgba(149, 165, 166, 0.1);
    }

    .bread-item-toggle {
      flex-direction: column;
      flex-shrink: 0;
      justify-content: center;
      align-items: center;
      gap: 4px;
      display: flex;
    }

    .toggle-switch {
      width: 44px;
      height: 24px;
      display: inline-block;
      position: relative;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      cursor: pointer;
      background-color: #ccc;
      border-radius: 24px;
      transition: all .3s;
      position: absolute;
      inset: 0;
    }

    .toggle-slider:before {
      content: "";
      background-color: #fff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      transition: all .3s;
      position: absolute;
      bottom: 3px;
      left: 3px;
    }

    .toggle-switch input:checked + .toggle-slider {
      background-color: var(--color-success);
    }

    .toggle-switch input:checked + .toggle-slider:before {
      transform: translateX(20px);
    }

    .toggle-label {
      color: var(--color-text-secondary);
      font-size: 12px;
      font-weight: 600;
    }

    .baker-breads-add-btn {
      bottom: calc(80px + env(safe-area-inset-bottom));
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
      color: #fff;
      z-index: 50;
      border-radius: 50%;
      justify-content: center;
      align-items: center;
      width: 56px;
      height: 56px;
      transition: all .3s;
      display: flex;
      position: fixed;
      right: 50%;
      transform: translateX(163.5px);
      box-shadow: 0 4px 12px rgba(230, 126, 34, 0.4);
      cursor: pointer;
      border: none;
    }

    .baker-breads-add-btn:active {
      transform: translateX(163.5px) scale(.95);
    }

    @media (max-width: 375px) {
      .baker-breads-add-btn {
        right: 16px;
        transform: none;
      }

      .baker-breads-add-btn:active {
        transform: scale(.95);
      }
    }

    .baker-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 375px;
      margin: 0 auto;
      background-color: white;
      border-top: 1px solid var(--color-border);
      display: flex;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }

    .baker-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 4px;
      color: var(--color-text-secondary);
      transition: color 0.2s;
      cursor: pointer;
      background: none;
      border: none;
    }

    .baker-nav-item.active {
      color: var(--color-primary);
    }

    .baker-nav-label {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="baker-breads-page">
    <div class="baker-breads-header">
      <div class="baker-breads-title">面包管理</div>
    </div>

    <div class="baker-breads-content">
      <div class="baker-breads-list" id="breadsList">
        <!-- 动态渲染 -->
      </div>
    </div>

    <button class="baker-breads-add-btn" onclick="addBread()">
      <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>

    <div class="baker-bottom-nav">
      <button class="baker-nav-item" onclick="window.location.href='baker-orders.html'">
        <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="4" rx="1"></rect>
          <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"></path>
          <path d="M16 13H8"></path>
          <path d="M16 17H8"></path>
          <path d="M10 9h6"></path>
        </svg>
        <span class="baker-nav-label">订单</span>
      </button>
      <button class="baker-nav-item active" onclick="window.location.href='baker-breads.html'">
        <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.6 13.11a5.07 5.07 0 0 0 .8 7.5"></path>
          <path d="M19.4 13.11a5.07 5.07 0 0 1-.8 7.5"></path>
          <path d="M3.8 6.06a4.89 4.89 0 0 1 2.4-1.9"></path>
          <path d="M20.2 6.06a4.89 4.89 0 0 0-2.4-1.9"></path>
          <path d="M8 2v2"></path>
          <path d="M16 2v2"></path>
          <path d="M12 20.94V22"></path>
          <path d="M3 12a9 9 0 0 1 8-8.94"></path>
          <path d="M21 12a9 9 0 0 0-8-8.94"></path>
        </svg>
        <span class="baker-nav-label">面包</span>
      </button>
      <button class="baker-nav-item" onclick="window.location.href='baker-profile.html'">
        <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="baker-nav-label">我的</span>
      </button>
    </div>
  </div>

  <script>
    const breads = [
      {
        id: '1',
        name: '经典法棍',
        price: 18.00,
        image: 'https://images.unsplash.com/photo-1549931319-a545dcf3bc73?w=400',
        description: '传统法式工艺，72小时低温发酵，外脆内软',
        dailyLimit: 20,
        currentStock: 8,
        isActive: true,
      },
      {
        id: '2',
        name: '牛角可颂',
        price: 12.00,
        image: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=400',
        description: '法国AOP认证黄油，层次分明',
        dailyLimit: 30,
        currentStock: 0,
        isActive: true,
      },
      {
        id: '3',
        name: '全麦软欧包',
        price: 22.00,
        image: 'https://images.unsplash.com/photo-1586444248902-2f64eddc13df?w=400',
        description: '100%全麦粉，添加坚果和果干，营养丰富',
        dailyLimit: 15,
        currentStock: 5,
        isActive: false,
      },
      {
        id: '4',
        name: '红豆吐司',
        price: 15.00,
        image: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400',
        description: '北海道红豆，香甜软糯',
        dailyLimit: 25,
        currentStock: 12,
        isActive: true,
      },
    ];

    function renderBreads() {
      const container = document.getElementById('breadsList');
      if (breads.length === 0) {
        container.innerHTML = `
          <div class="baker-breads-empty">
            <div class="baker-breads-empty-icon">🥖</div>
            <div class="baker-breads-empty-text">还没有添加面包</div>
            <div class="baker-breads-empty-hint">点击右下角按钮添加</div>
          </div>
        `;
        return;
      }

      container.innerHTML = breads.map(bread => `
        <div class="bread-item" onclick="editBread('${bread.id}')">
          <div class="bread-item-image-wrapper">
            <img src="${bread.image}" alt="${bread.name}" class="bread-item-image" />
            ${!bread.isActive ? '<div class="bread-item-inactive-mask">已下架</div>' : ''}
          </div>
          <div class="bread-item-info">
            <div class="bread-item-header">
              <div class="bread-item-name">${bread.name}</div>
              <div class="bread-item-price">¥${bread.price.toFixed(2)}</div>
            </div>
            <div class="bread-item-stock">
              <span class="bread-item-stock-text ${bread.currentStock === 0 ? 'sold-out' : ''}">
                ${bread.currentStock === 0 ? '已售罄' : `库存 ${bread.currentStock}/${bread.dailyLimit}`}
              </span>
            </div>
          </div>
          <div class="bread-item-toggle" onclick="event.stopPropagation()">
            <label class="toggle-switch">
              <input type="checkbox" ${bread.isActive ? 'checked' : ''} onchange="toggleActive('${bread.id}')" />
              <span class="toggle-slider"></span>
            </label>
            <span class="toggle-label">${bread.isActive ? '上架' : '下架'}</span>
          </div>
        </div>
      `).join('');
    }

    function toggleActive(id) {
      const bread = breads.find(b => b.id === id);
      if (bread) {
        bread.isActive = !bread.isActive;
        renderBreads();
      }
    }

    function editBread(id) {
      window.location.href = `bread-edit-modal.html?id=${id}`;
    }

    function addBread() {
      window.location.href = 'bread-edit-modal.html';
    }

    renderBreads();
  </script>
</body>
</html>
