<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主理人中心 - 面包工坊</title>
  <link rel="stylesheet" href="common.css">
  <style>
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .baker-profile-page {
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: var(--color-bg);
      padding-bottom: calc(70px + env(safe-area-inset-bottom));
    }

    .baker-profile-header {
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
      padding: 16px;
      border-radius: 0 0 24px 24px;
      margin-bottom: 16px;
    }

    .baker-profile-user-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .baker-profile-user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .baker-profile-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.3);
    }

    .baker-profile-user-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .baker-profile-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .baker-profile-name {
      font-size: 18px;
      font-weight: 700;
      color: white;
    }

    .baker-order-status-inline {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .baker-order-toggle-inline {
      position: relative;
      width: 32px;
      height: 18px;
      border-radius: 9px;
      background-color: rgba(255, 255, 255, 0.3);
      transition: background-color 0.3s;
      flex-shrink: 0;
      cursor: pointer;
      border: none;
    }

    .baker-order-toggle-inline.active {
      background-color: white;
    }

    .baker-order-toggle-knob-inline {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.8);
      transition: all 0.3s;
    }

    .baker-order-toggle-inline.active .baker-order-toggle-knob-inline {
      left: 16px;
      background-color: var(--color-primary);
    }

    .baker-order-status-text-inline {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      color: white;
    }

    .baker-profile-specialties {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.9);
    }

    .baker-profile-settings-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
      cursor: pointer;
      border: none;
    }

    .baker-profile-settings-btn:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }

    .baker-profile-quick-actions {
      display: flex;
      gap: 8px;
    }

    .baker-quick-action-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 6px;
      background-color: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
    }

    .baker-quick-action-btn:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }

    .baker-quick-action-btn:active {
      transform: scale(0.95);
    }

    .baker-stats-section {
      padding: 0 16px;
      margin-bottom: 16px;
    }

    .baker-stats-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: 12px;
    }

    .baker-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .baker-stat-card {
      background-color: white;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .baker-stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--color-primary);
    }

    .baker-stat-label {
      font-size: 13px;
      color: var(--color-text-secondary);
      text-align: center;
    }

    .baker-settings-overlay {
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.3);
      animation: 0.2s ease-out fadeIn;
      position: fixed;
      inset: 0;
    }

    .baker-settings-menu {
      background-color: #fff;
      border-radius: 12px;
      min-width: 160px;
      animation: 0.2s ease-out scaleIn;
      position: absolute;
      top: 70px;
      right: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .baker-settings-item {
      width: 100%;
      color: var(--color-text-primary);
      border-bottom: 1px solid var(--color-border);
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      font-size: 15px;
      transition: background-color 0.2s;
      display: flex;
      cursor: pointer;
      border: none;
      background: none;
    }

    .baker-settings-item:last-child {
      border-bottom: none;
    }

    .baker-settings-item:hover {
      background-color: var(--color-bg);
    }

    .baker-settings-item.logout {
      color: var(--color-error);
    }

    .baker-logout-overlay {
      z-index: 2000;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: 0.3s ease-out fadeIn;
      display: flex;
      position: fixed;
      inset: 0;
    }

    .baker-logout-dialog {
      background-color: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 320px;
      padding: 24px;
      animation: 0.3s ease-out scaleIn;
      position: relative;
    }

    .baker-logout-close {
      background-color: var(--color-bg);
      width: 32px;
      height: 32px;
      color: var(--color-text-secondary);
      border-radius: 50%;
      justify-content: center;
      align-items: center;
      transition: background-color 0.2s;
      display: flex;
      position: absolute;
      top: 16px;
      right: 16px;
      cursor: pointer;
      border: none;
    }

    .baker-logout-close:hover {
      background-color: var(--color-border);
    }

    .baker-logout-content {
      margin-bottom: 24px;
      padding-right: 32px;
    }

    .baker-logout-title {
      color: var(--color-text-primary);
      margin-bottom: 8px;
      font-size: 18px;
      font-weight: 700;
    }

    .baker-logout-message {
      color: var(--color-text-secondary);
      font-size: 14px;
      line-height: 1.5;
    }

    .baker-logout-actions {
      gap: 12px;
      display: flex;
    }

    .baker-logout-cancel,
    .baker-logout-confirm {
      border-radius: 22px;
      flex: 1;
      height: 44px;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
    }

    .baker-logout-cancel {
      background-color: var(--color-bg);
      color: var(--color-text-secondary);
    }

    .baker-logout-cancel:hover {
      background-color: var(--color-border);
    }

    .baker-logout-confirm {
      background-color: var(--color-error);
      color: #fff;
    }

    .baker-logout-confirm:active {
      transform: scale(0.98);
    }

    .baker-bottom-nav {
      border-top: 1px solid var(--color-border);
      max-width: 375px;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
      background-color: #fff;
      margin: 0 auto;
      display: flex;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
    }

    .baker-nav-item {
      color: var(--color-text-secondary);
      flex-direction: column;
      flex: 1;
      align-items: center;
      gap: 4px;
      padding: 4px;
      transition: color 0.2s;
      display: flex;
      cursor: pointer;
      border: none;
      background: none;
    }

    .baker-nav-item.active {
      color: var(--color-primary);
    }

    .baker-nav-label {
      font-size: 12px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="baker-profile-page">
    <div class="baker-profile-header">
      <div class="baker-profile-user-section">
        <div class="baker-profile-user-info">
          <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200" alt="主理人" class="baker-profile-avatar" />
          <div class="baker-profile-user-details">
            <div class="baker-profile-name-row">
              <div class="baker-profile-name">我的面包工坊</div>
              <div class="baker-order-status-inline">
                <button class="baker-order-toggle-inline active" id="orderToggle" onclick="toggleOrderStatus()">
                  <div class="baker-order-toggle-knob-inline"></div>
                </button>
                <span class="baker-order-status-text-inline" id="orderStatusText">营业中</span>
              </div>
            </div>
            <div class="baker-profile-specialties">主营：法棍、可颂、欧包、软欧包</div>
          </div>
        </div>
        <button class="baker-profile-settings-btn" onclick="toggleSettings()">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px; color: white;">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 1v6m0 6v6m9-9h-6m-6 0H3m15.364 6.364l-4.243-4.243m-4.242 0L5.636 18.364m12.728 0l-4.243-4.243m-4.242 0L5.636 5.636"></path>
          </svg>
        </button>
      </div>

      <div class="baker-profile-quick-actions">
        <button class="baker-quick-action-btn" onclick="window.location.href='payment-qrcode-modal.html'">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
            <rect x="3" y="3" width="5" height="5"></rect>
            <rect x="16" y="3" width="5" height="5"></rect>
            <rect x="3" y="16" width="5" height="5"></rect>
            <path d="M21 16h-3a2 2 0 0 0-2 2v3"></path>
            <path d="M16 21v-3a2 2 0 0 0-2-2h-3"></path>
          </svg>
          <span>收款码</span>
        </button>
        <button class="baker-quick-action-btn" onclick="window.location.href='profile.html'">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
            <polyline points="17 11 21 7 17 3"></polyline>
            <path d="M21 7H7"></path>
            <polyline points="7 13 3 17 7 21"></polyline>
            <path d="M3 17h14"></path>
          </svg>
          <span>切换用户</span>
        </button>
      </div>
    </div>

    <div class="baker-stats-section">
      <div class="baker-stats-title">数据看板</div>
      <div class="baker-stats-grid">
        <div class="baker-stat-card">
          <div class="baker-stat-value">12</div>
          <div class="baker-stat-label">今日订单数</div>
        </div>
        <div class="baker-stat-card">
          <div class="baker-stat-value">5</div>
          <div class="baker-stat-label">待处理订单</div>
        </div>
        <div class="baker-stat-card">
          <div class="baker-stat-value">¥1280.50</div>
          <div class="baker-stat-label">今日收入</div>
        </div>
        <div class="baker-stat-card">
          <div class="baker-stat-value">¥45678.90</div>
          <div class="baker-stat-label">总收入</div>
        </div>
      </div>
    </div>

    <!-- 设置菜单 -->
    <div class="baker-settings-overlay hidden" id="settingsOverlay" onclick="closeSettings()">
      <div class="baker-settings-menu" onclick="event.stopPropagation()">
        <button class="baker-settings-item" onclick="openEditModal()">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          <span>编辑资料</span>
        </button>
        <button class="baker-settings-item logout" onclick="handleLogout()">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>退出登录</span>
        </button>
      </div>
    </div>

    <!-- 退出登录确认弹窗 -->
    <div class="baker-logout-overlay hidden" id="logoutOverlay" onclick="closeLogoutConfirm()">
      <div class="baker-logout-dialog" onclick="event.stopPropagation()">
        <button class="baker-logout-close" onclick="closeLogoutConfirm()">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <div class="baker-logout-content">
          <div class="baker-logout-title">确认退出登录？</div>
          <div class="baker-logout-message">退出后需要重新登录才能继续使用</div>
        </div>
        <div class="baker-logout-actions">
          <button class="baker-logout-cancel" onclick="closeLogoutConfirm()">取消</button>
          <button class="baker-logout-confirm" onclick="confirmLogout()">退出登录</button>
        </div>
      </div>
    </div>

    <div class="baker-bottom-nav">
      <div class="baker-nav-item" onclick="window.location.href='baker-orders.html'">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;">
          <rect x="9" y="2" width="6" height="4" rx="1"></rect>
          <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"></path>
          <path d="M16 13H8"></path>
          <path d="M16 17H8"></path>
          <path d="M10 9h6"></path>
        </svg>
        <span class="baker-nav-label">订单</span>
      </div>
      <div class="baker-nav-item" onclick="window.location.href='baker-breads.html'">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;">
          <path d="M4.6 13.11a5.07 5.07 0 0 0 .8 7.5"></path>
          <path d="M19.4 13.11a5.07 5.07 0 0 1-.8 7.5"></path>
          <path d="M3.8 6.06a4.89 4.89 0 0 1 2.4-1.9"></path>
          <path d="M20.2 6.06a4.89 4.89 0 0 0-2.4-1.9"></path>
          <path d="M8 2v2"></path>
          <path d="M16 2v2"></path>
          <path d="M12 20.94V22"></path>
          <path d="M3 12a9 9 0 0 1 8-8.94"></path>
          <path d="M21 12a9 9 0 0 0-8-8.94"></path>
        </svg>
        <span class="baker-nav-label">面包</span>
      </div>
      <div class="baker-nav-item active" onclick="window.location.href='baker-profile.html'">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="baker-nav-label">我的</span>
      </div>
    </div>
  </div>

  <script>
    let isAcceptingOrders = true;

    function toggleOrderStatus() {
      isAcceptingOrders = !isAcceptingOrders;
      const toggle = document.getElementById('orderToggle');
      const statusText = document.getElementById('orderStatusText');
      
      if (isAcceptingOrders) {
        toggle.classList.add('active');
        statusText.textContent = '营业中';
      } else {
        toggle.classList.remove('active');
        statusText.textContent = '休息中';
      }
    }

    function toggleSettings() {
      const overlay = document.getElementById('settingsOverlay');
      overlay.classList.toggle('hidden');
    }

    function closeSettings() {
      const overlay = document.getElementById('settingsOverlay');
      overlay.classList.add('hidden');
    }

    function openEditModal() {
      closeSettings();
      window.location.href = 'edit-baker-info-modal.html';
    }

    function handleLogout() {
      closeSettings();
      const overlay = document.getElementById('logoutOverlay');
      overlay.classList.remove('hidden');
    }

    function closeLogoutConfirm() {
      const overlay = document.getElementById('logoutOverlay');
      overlay.classList.add('hidden');
    }

    function confirmLogout() {
      alert('退出登录成功');
      window.location.href = 'profile.html';
    }
  </script>
</body>
</html>
