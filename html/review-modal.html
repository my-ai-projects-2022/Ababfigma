<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>评价订单 - 面包工坊</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .review-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease-out;
    }

    .review-modal {
      width: 100%;
      max-width: 375px;
      max-height: 85vh;
      background-color: white;
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s ease-out;
    }

    .review-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    .review-modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text-primary);
    }

    .review-modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-secondary);
      transition: background-color 0.2s;
      cursor: pointer;
    }

    .review-modal-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }

    .review-bread-section {
      padding: 16px 0;
      border-bottom: 1px solid var(--color-border);
    }

    .review-bread-section:last-child {
      border-bottom: none;
    }

    .review-bread-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .review-bread-image-wrapper {
      width: 50px;
      height: 50px;
      border-radius: 6px;
      overflow: hidden;
      background-color: var(--color-bg);
      flex-shrink: 0;
    }

    .review-bread-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .review-bread-info {
      flex: 1;
    }

    .review-bread-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 4px;
    }

    .review-bread-price {
      font-size: 13px;
      color: var(--color-text-secondary);
    }

    .review-rating-section {
      margin-bottom: 16px;
    }

    .review-rating-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 12px;
    }

    .review-stars {
      display: flex;
      gap: 8px;
    }

    .review-star-btn {
      padding: 0;
      transition: transform 0.2s;
      cursor: pointer;
      background: none;
      border: none;
    }

    .review-star-btn:hover {
      transform: scale(1.1);
    }

    .review-star-btn:active {
      transform: scale(0.95);
    }

    .review-stars .star-filled {
      color: var(--color-primary);
    }

    .review-stars .star-empty {
      color: var(--color-border);
    }

    .review-comment-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .review-comment-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .review-comment-count {
      font-size: 12px;
      font-weight: 400;
      color: var(--color-text-secondary);
    }

    .review-comment-textarea {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--color-text-primary);
      resize: vertical;
      transition: border-color 0.2s;
      font-family: inherit;
      outline: none;
    }

    .review-comment-textarea:focus {
      border-color: var(--color-primary);
    }

    .review-comment-textarea::placeholder {
      color: var(--color-text-secondary);
    }

    .review-modal-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    .review-submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
      color: white;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s;
      cursor: pointer;
    }

    .review-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(230, 126, 34, 0.3);
    }
  </style>
</head>
<body>
  <div class="review-modal-overlay" onclick="if(event.target === this) window.history.back()">
    <div class="review-modal" onclick="event.stopPropagation()">
      <div class="review-modal-header">
        <h2 class="review-modal-title">评价订单</h2>
        <button class="review-modal-close" onclick="window.history.back()">
          <svg class="icon icon-lg" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      
      <div class="review-modal-content" id="reviewContent">
        <!-- 动态渲染 -->
      </div>
      
      <div class="review-modal-footer">
        <button class="review-submit-btn" onclick="submitReview()">提交评价</button>
      </div>
    </div>
  </div>

  <script>
    const orderBreads = [
      {
        id: '1',
        name: '经典法棍',
        image: 'https://images.unsplash.com/photo-1549931319-a545dcf3bc73?w=400',
        price: 18.00,
        quantity: 2,
      },
      {
        id: '2',
        name: '牛角可颂',
        image: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=400',
        price: 12.00,
        quantity: 1,
      },
    ];

    const reviews = {};

    function renderReviewContent() {
      const container = document.getElementById('reviewContent');
      container.innerHTML = orderBreads.map((bread, index) => {
        const review = reviews[bread.id] || { rating: 0, comment: '' };
        return `
          <div class="review-bread-section">
            <div class="review-bread-header">
              <div class="review-bread-image-wrapper">
                <img src="${bread.image}" alt="${bread.name}" class="review-bread-image" />
              </div>
              <div class="review-bread-info">
                <div class="review-bread-name">${bread.name}</div>
                <div class="review-bread-price">¥${bread.price.toFixed(2)} x${bread.quantity}</div>
              </div>
            </div>
            
            <div class="review-rating-section">
              <div class="review-rating-label">评分</div>
              <div class="review-stars">
                ${[1, 2, 3, 4, 5].map(star => `
                  <button class="review-star-btn" onclick="setRating('${bread.id}', ${star})">
                    <svg class="icon icon-lg ${star <= review.rating ? 'star-filled' : 'star-empty'}" viewBox="0 0 24 24" ${star <= review.rating ? 'fill="currentColor"' : ''}>
                      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                  </button>
                `).join('')}
              </div>
            </div>
            
            <div class="review-comment-section">
              <div class="review-comment-label">
                评价内容
                <span class="review-comment-count">${review.comment.length}/200</span>
              </div>
              <textarea
                class="review-comment-textarea"
                placeholder="分享你的品尝体验吧..."
                maxlength="200"
                oninput="updateComment('${bread.id}', this.value)"
              >${review.comment}</textarea>
            </div>
          </div>
        `;
      }).join('');
    }

    function setRating(breadId, rating) {
      if (!reviews[breadId]) {
        reviews[breadId] = { rating: 0, comment: '' };
      }
      reviews[breadId].rating = rating;
      renderReviewContent();
    }

    function updateComment(breadId, comment) {
      if (!reviews[breadId]) {
        reviews[breadId] = { rating: 0, comment: '' };
      }
      reviews[breadId].comment = comment;
      renderReviewContent();
    }

    function submitReview() {
      alert('评价已提交');
      window.history.back();
    }

    renderReviewContent();
  </script>
</body>
</html>
