<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购物车 - 面包工坊</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .cart-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease-out;
    }

    .cart-modal-content {
      background-color: white;
      width: 100%;
      max-width: 375px;
      max-height: 70vh;
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s ease-out;
    }

    .cart-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid var(--color-border);
    }

    .cart-modal-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .cart-modal-clear {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 16px;
      background-color: var(--color-bg);
      color: var(--color-text-secondary);
      font-size: 13px;
      transition: background-color 0.2s;
      cursor: pointer;
    }

    .cart-modal-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }

    .cart-modal-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .cart-empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .cart-empty-text {
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    .cart-modal-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--color-border);
    }

    .cart-modal-item:last-child {
      border-bottom: none;
    }

    .cart-item-image {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .cart-item-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .cart-item-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cart-item-price {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-primary);
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .cart-item-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: var(--color-primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
      cursor: pointer;
    }

    .cart-item-quantity {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-primary);
      min-width: 24px;
      text-align: center;
    }

    .cart-modal-footer {
      padding: 16px;
      border-top: 1px solid var(--color-border);
      background-color: white;
    }

    .cart-modal-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cart-total-label {
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    .cart-total-price {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-primary);
    }
  </style>
</head>
<body>
  <div class="cart-modal-overlay" onclick="if(event.target === this) window.history.back()">
    <div class="cart-modal-content">
      <div class="cart-modal-header">
        <h3 class="cart-modal-title">已选商品</h3>
        <button class="cart-modal-clear" onclick="clearCart()">
          <svg class="icon icon-sm" viewBox="0 0 24 24">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>清空</span>
        </button>
      </div>

      <div class="cart-modal-list" id="cartList">
        <!-- 动态渲染 -->
      </div>

      <div class="cart-modal-footer" id="cartFooter">
        <div class="cart-modal-total">
          <span class="cart-total-label" id="totalLabel">已选 0 件</span>
          <span class="cart-total-price" id="totalPrice">¥0.00</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cartItems = [
      {
        bread: {
          id: '1',
          name: '经典法棍',
          image: 'https://images.unsplash.com/photo-1549931319-a545dcf3bc73?w=400',
          price: 18.00,
        },
        quantity: 2,
      },
      {
        bread: {
          id: '2',
          name: '牛角可颂',
          image: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=400',
          price: 12.00,
        },
        quantity: 1,
      },
    ];

    function renderCart() {
      const container = document.getElementById('cartList');
      const totalLabel = document.getElementById('totalLabel');
      const totalPrice = document.getElementById('totalPrice');

      if (cartItems.length === 0) {
        container.innerHTML = `
          <div class="cart-modal-empty">
            <div class="cart-empty-icon">🛒</div>
            <p class="cart-empty-text">购物车是空的</p>
          </div>
        `;
        return;
      }

      container.innerHTML = cartItems.map((item, index) => `
        <div class="cart-modal-item">
          <img src="${item.bread.image}" alt="${item.bread.name}" class="cart-item-image" />
          <div class="cart-item-info">
            <div class="cart-item-name">${item.bread.name}</div>
            <div class="cart-item-price">¥${item.bread.price.toFixed(2)}</div>
          </div>
          <div class="cart-item-controls">
            <button class="cart-item-btn" onclick="updateItem(${index}, ${item.quantity - 1})">
              <svg class="icon icon-sm" viewBox="0 0 24 24">
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
            <span class="cart-item-quantity">${item.quantity}</span>
            <button class="cart-item-btn" onclick="updateItem(${index}, ${item.quantity + 1})">
              <svg class="icon icon-sm" viewBox="0 0 24 24">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </div>
        </div>
      `).join('');

      const totalItems = cartItems.reduce((sum, item) => sum + item.quantity, 0);
      const total = cartItems.reduce((sum, item) => sum + item.bread.price * item.quantity, 0);

      totalLabel.textContent = `已选 ${totalItems} 件`;
      totalPrice.textContent = `¥${total.toFixed(2)}`;
    }

    function updateItem(index, newQuantity) {
      if (newQuantity <= 0) {
        cartItems.splice(index, 1);
      } else {
        cartItems[index].quantity = newQuantity;
      }
      renderCart();
    }

    function clearCart() {
      if (confirm('确定要清空购物车吗？')) {
        cartItems.length = 0;
        renderCart();
      }
    }

    renderCart();
  </script>
</body>
</html>
