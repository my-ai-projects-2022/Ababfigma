<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>更新订单 - 面包工坊</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .update-orders-modal-overlay {
      z-index: 2000;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: flex-end;
      animation: fadeIn 0.3s ease-out;
      display: flex;
      position: fixed;
      inset: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .update-orders-modal-content {
      background-color: #fff;
      border-radius: 24px 24px 0 0;
      flex-direction: column;
      width: 100%;
      max-width: 375px;
      max-height: 80vh;
      animation: slideUp 0.3s ease-out;
      display: flex;
      position: relative;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(100%);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .update-orders-modal-header {
      border-bottom: 1px solid var(--color-border);
      padding: 20px;
      position: relative;
    }

    .update-orders-modal-title {
      color: var(--color-text-primary);
      text-align: center;
      padding-right: 32px;
      font-size: 17px;
      font-weight: 700;
    }

    .update-orders-modal-close {
      background-color: var(--color-bg);
      width: 32px;
      height: 32px;
      color: var(--color-text-secondary);
      border-radius: 50%;
      justify-content: center;
      align-items: center;
      transition: background-color .2s;
      display: flex;
      position: absolute;
      top: 16px;
      right: 16px;
      cursor: pointer;
      border: none;
    }

    .update-orders-modal-close:hover {
      background-color: var(--color-border);
    }

    .update-orders-modal-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }

    .update-order-card {
      background-color: var(--color-bg);
      border-radius: 12px;
      margin-bottom: 12px;
      padding: 12px;
    }

    .update-order-card:last-child {
      margin-bottom: 0;
    }

    .update-order-bread-info {
      border-bottom: 1px solid var(--color-border);
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      display: flex;
    }

    .update-order-bread-name {
      color: var(--color-text-primary);
      font-size: 15px;
      font-weight: 700;
    }

    .update-order-bread-count {
      color: var(--color-primary);
      font-size: 14px;
      font-weight: 600;
    }

    .update-order-user-section {
      margin-bottom: 12px;
    }

    .update-order-user-info {
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      display: flex;
    }

    .update-order-user-avatar {
      object-fit: cover;
      border-radius: 50%;
      width: 32px;
      height: 32px;
    }

    .update-order-user-details {
      flex-direction: column;
      gap: 2px;
      display: flex;
    }

    .update-order-user-name {
      color: var(--color-text-primary);
      font-size: 14px;
      font-weight: 600;
    }

    .update-order-number {
      color: var(--color-text-secondary);
      font-size: 12px;
    }

    .update-order-user-address {
      color: var(--color-text-secondary);
      align-items: center;
      gap: 4px;
      padding-left: 40px;
      font-size: 12px;
      display: flex;
    }

    .update-order-progress-section {
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      display: flex;
    }

    .update-order-progress-input-group {
      flex: 1;
      align-items: center;
      gap: 6px;
      display: flex;
    }

    .update-order-progress-label {
      color: var(--color-text-secondary);
      font-size: 13px;
    }

    .update-order-progress-input {
      border: 1px solid var(--color-border);
      width: 50px;
      color: var(--color-text-primary);
      text-align: center;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 14px;
      font-weight: 600;
    }

    .update-order-progress-input:focus {
      border-color: var(--color-primary);
      outline: none;
    }

    .update-order-progress-total {
      color: var(--color-text-secondary);
      font-size: 13px;
    }

    .update-order-complete-btn {
      background-color: var(--color-primary);
      color: #fff;
      border-radius: 16px;
      min-width: 60px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      transition: all .2s;
      cursor: pointer;
      border: none;
    }

    .update-order-complete-btn.completed {
      background-color: var(--color-success);
    }

    .update-order-complete-btn:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .update-order-complete-btn:active:not(:disabled) {
      transform: scale(.95);
    }

    .update-orders-modal-footer {
      border-top: 1px solid var(--color-border);
      padding: 16px;
    }

    .update-orders-close-btn {
      background-color: var(--color-bg);
      width: 100%;
      height: 44px;
      color: var(--color-text-secondary);
      border-radius: 22px;
      font-size: 16px;
      font-weight: 600;
      transition: all .2s;
      cursor: pointer;
      border: none;
    }

    .update-orders-close-btn:hover {
      background-color: var(--color-border);
    }
  </style>
</head>
<body>
  <div class="update-orders-modal-overlay" onclick="if(event.target === this) closeModal()">
    <div class="update-orders-modal-content">
      <div class="update-orders-modal-header">
        <div class="update-orders-modal-title" id="modalTitle">更新贝果订单 (5/15)</div>
        <button class="update-orders-modal-close" onclick="closeModal()">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="update-orders-modal-body" id="ordersList">
        <!-- 动态渲染 -->
      </div>

      <div class="update-orders-modal-footer">
        <button class="update-orders-close-btn" onclick="closeModal()">关闭</button>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const taskId = urlParams.get('taskId') || '1';

    const breadData = {
      '1': {
        id: '1',
        name: '贝果',
        totalCount: 15,
        completedCount: 5,
        orders: [
          {
            orderId: '1',
            orderNumber: '#2024121601',
            userName: '张小姐',
            userAvatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200',
            userAddress: '武侯区桐梓林',
            count: 3,
            completedCount: 0,
          },
          {
            orderId: '2',
            orderNumber: '#2024121602',
            userName: '李先生',
            userAvatar: 'https://images.unsplash.com/photo-1599566150163-29194dcaad36?w=200',
            count: 2,
            completedCount: 2,
          },
          {
            orderId: '4',
            orderNumber: '#2024121604',
            userName: '赵女士',
            userAvatar: 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=200',
            userAddress: '高新区天府软件园',
            count: 10,
            completedCount: 3,
          },
        ],
      },
      '2': {
        id: '2',
        name: '土司',
        totalCount: 8,
        completedCount: 3,
        orders: [
          {
            orderId: '1',
            orderNumber: '#2024121601',
            userName: '张小姐',
            userAvatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200',
            userAddress: '武侯区桐梓林',
            count: 5,
            completedCount: 0,
          },
          {
            orderId: '5',
            orderNumber: '#2024121605',
            userName: '周先生',
            userAvatar: 'https://images.unsplash.com/photo-1599566150163-29194dcaad36?w=200',
            count: 3,
            completedCount: 3,
          },
        ],
      },
    };

    const bread = breadData[taskId] || breadData['1'];

    function renderOrders() {
      const container = document.getElementById('ordersList');
      const totalCompleted = bread.orders.reduce((sum, o) => sum + o.completedCount, 0);
      
      document.getElementById('modalTitle').textContent = 
        `更新${bread.name}订单 (${totalCompleted}/${bread.totalCount})`;

      container.innerHTML = bread.orders.map(order => `
        <div class="update-order-card">
          <div class="update-order-bread-info">
            <span class="update-order-bread-name">${bread.name}</span>
            <span class="update-order-bread-count">×${order.count}</span>
          </div>
          <div class="update-order-user-section">
            <div class="update-order-user-info">
              <img
                src="${order.userAvatar}"
                alt="${order.userName}"
                class="update-order-user-avatar"
              />
              <div class="update-order-user-details">
                <div class="update-order-user-name">${order.userName}</div>
                <div class="update-order-number">${order.orderNumber}</div>
              </div>
            </div>
            ${order.userAddress ? `
              <div class="update-order-user-address">
                <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span>${order.userAddress}</span>
              </div>
            ` : ''}
          </div>
          <div class="update-order-progress-section">
            <div class="update-order-progress-input-group">
              <span class="update-order-progress-label">完成数量：</span>
              <input
                type="number"
                min="0"
                max="${order.count}"
                value="${order.completedCount}"
                onchange="handleInputChange('${order.orderId}', this.value)"
                class="update-order-progress-input"
              />
              <span class="update-order-progress-total">/ ${order.count}</span>
            </div>
            <button
              class="update-order-complete-btn ${order.completedCount === order.count ? 'completed' : ''}"
              onclick="handleComplete('${order.orderId}', ${order.count})"
              ${order.completedCount === order.count ? 'disabled' : ''}
            >
              ${order.completedCount === order.count ? '✓' : '完成'}
            </button>
          </div>
        </div>
      `).join('');
    }

    function handleInputChange(orderId, value) {
      const order = bread.orders.find(o => o.orderId === orderId);
      if (order) {
        const count = Math.max(0, Math.min(parseInt(value) || 0, order.count));
        order.completedCount = count;
        renderOrders();
      }
    }

    function handleComplete(orderId, count) {
      const order = bread.orders.find(o => o.orderId === orderId);
      if (order) {
        order.completedCount = count;
        renderOrders();
      }
    }

    function closeModal() {
      window.history.back();
    }

    renderOrders();
  </script>
</body>
</html>
