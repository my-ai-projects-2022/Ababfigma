<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑资料 - 面包工坊</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .edit-profile-page {
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: var(--color-bg);
    }

    .page-header {
      position: sticky;
      top: 0;
      height: 56px;
      background-color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--color-border);
      z-index: 100;
    }

    .page-back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-primary);
      transition: background-color 0.2s;
      cursor: pointer;
    }

    .page-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-primary);
      flex: 1;
      text-align: center;
    }

    .page-header-spacer {
      width: 40px;
    }

    .edit-profile-content {
      padding: 16px;
    }

    .edit-profile-form {
      background-color: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 8px;
    }

    .avatar-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-upload {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid var(--color-border);
    }

    .avatar-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-upload-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .avatar-upload:hover .avatar-upload-overlay {
      opacity: 1;
    }

    .form-input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--color-text-primary);
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--color-primary);
    }

    .gender-options {
      display: flex;
      gap: 12px;
    }

    .gender-option {
      flex: 1;
      height: 40px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--color-text-primary);
      background-color: white;
      transition: all 0.2s;
      cursor: pointer;
    }

    .gender-option.active {
      background-color: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }

    .edit-profile-footer {
      padding: 0 16px 16px;
    }

    .save-profile-btn {
      width: 100%;
      height: 44px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
      color: white;
      border-radius: 22px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3);
      transition: transform 0.2s;
      cursor: pointer;
    }

    .save-profile-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="edit-profile-page">
    <div class="page-header">
      <button class="page-back-btn" onclick="window.history.back()">
        <svg class="icon icon-lg" viewBox="0 0 24 24">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="page-title">编辑资料</h1>
      <div class="page-header-spacer"></div>
    </div>

    <div class="edit-profile-content">
      <div class="edit-profile-form">
        <div class="form-group avatar-group">
          <label class="form-label">头像</label>
          <button class="avatar-upload" onclick="uploadAvatar()">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200" alt="头像" class="avatar-preview" id="avatarPreview" />
            <div class="avatar-upload-overlay">
              <svg class="icon icon-lg" viewBox="0 0 24 24" style="color: white;">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
            </div>
          </button>
        </div>

        <div class="form-group">
          <label class="form-label">昵称</label>
          <input type="text" class="form-input" id="nicknameInput" placeholder="请输入昵称" maxlength="20" value="面包爱好者" />
        </div>

        <div class="form-group">
          <label class="form-label">性别</label>
          <div class="gender-options">
            <button class="gender-option active" id="maleBtn" onclick="setGender('male')">男</button>
            <button class="gender-option" id="femaleBtn" onclick="setGender('female')">女</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">手机号</label>
          <input type="tel" class="form-input" id="phoneInput" placeholder="请输入手机号" maxlength="11" value="13800138000" />
        </div>
      </div>

      <div class="edit-profile-footer">
        <button class="save-profile-btn" onclick="saveProfile()">保存</button>
      </div>
    </div>
  </div>

  <script>
    let selectedGender = 'male';

    function setGender(gender) {
      selectedGender = gender;
      document.getElementById('maleBtn').classList.toggle('active', gender === 'male');
      document.getElementById('femaleBtn').classList.toggle('active', gender === 'female');
    }

    function uploadAvatar() {
      alert('头像上传功能待实现');
    }

    function saveProfile() {
      const nickname = document.getElementById('nicknameInput').value.trim();
      const phone = document.getElementById('phoneInput').value.trim();

      if (!nickname) {
        alert('请输入昵称');
        return;
      }
      if (nickname.length < 2) {
        alert('昵称至少需要2个字');
        return;
      }
      if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
        alert('请输入正确的手机号');
        return;
      }

      alert('资料已保存');
      window.history.back();
    }
  </script>
</body>
</html>
